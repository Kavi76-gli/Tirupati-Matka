<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Declare Gali Result</title>

<link rel="stylesheet" href="global.css">

<style>
body{
  background:#0a1a2f;
  color:#00eaff;
  font-family:"Segoe UI",Arial,sans-serif;
  padding:20px;
}
h2{text-align:center;margin-bottom:20px}
.row{display:flex;gap:10px;margin-bottom:20px}
input{
  flex:1;
  padding:14px;
  border-radius:14px;
  border:1px solid #00eaff44;
  background:#020f24;
  color:#00eaff;
  font-size:20px;
  text-align:center;
}
button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:30px;
  font-weight:bold;
  background:linear-gradient(135deg,#00eaff,#0099ff);
  color:#001a3d;
  font-size:18px;
  margin-top:18px;
  cursor:pointer;
}
button:disabled{opacity:.6;cursor:not-allowed}
#msg{
  margin-top:14px;
  text-align:center;
  font-weight:bold;
  white-space:pre-line;
}
</style>
</head>

<body>

<h2>Declare Gali Result</h2>

<div class="row">
  <input id="left" maxlength="1" placeholder="Left (0-9)">
  <input id="right" maxlength="1" placeholder="Right (0-9)">
</div>

<button id="btn">Declare Result</button>

<div id="msg"></div>

<script>
const API = "https://tirupati-matka.onrender.com/api/gali";
const token = localStorage.getItem("token");
const matchId = localStorage.getItem("galiAdminMatchId");

const leftInput = document.getElementById("left");
const rightInput = document.getElementById("right");
const submitBtn = document.getElementById("btn");
const msgEl = document.getElementById("msg");

submitBtn.onclick = async () => {
  const left = leftInput.value.trim();
  const right = rightInput.value.trim();

  const hasLeft = left !== "";
  const hasRight = right !== "";

  // ✅ allow partial result
  if (!hasLeft && !hasRight) {
    msgEl.innerText = "⚠️ Enter left or right digit";
    return;
  }

  if (
    (hasLeft && (isNaN(left) || left < 0 || left > 9)) ||
    (hasRight && (isNaN(right) || right < 0 || right > 9))
  ) {
    msgEl.innerText = "⚠️ Digits must be between 0–9";
    return;
  }

  submitBtn.disabled = true;
  submitBtn.innerText = "Submitting...";

  try {
    const res = await fetch(API + "/admin/result", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({
        matchId,
        left: hasLeft ? left : undefined,
        right: hasRight ? right : undefined
      })
    });

    const data = await res.json();

    if (!res.ok) {
      msgEl.innerText = "❌ " + (data.msg || "Failed");
      submitBtn.disabled = false;
      submitBtn.innerText = "Declare Result";
      return;
    }

    // ✅ build display text safely
    let resultText = `✅ Result Declared\n`;

    if (hasLeft) resultText += `Left: ${left}\n`;
    if (hasRight) resultText += `Right: ${right}\n`;
    if (hasLeft && hasRight) resultText += `Jodi: ${left}${right}\n`;

    resultText += `\nTotal Winners: ${data.winners}`;
    resultText += `\nTotal Payout: ₹${data.totalWinAmount}`;

    msgEl.innerText = resultText;

    setTimeout(() => location.href = "gali-admin.html", 4000);

  } catch (err) {
    console.error(err);
    msgEl.innerText = "❌ Server error";
    submitBtn.disabled = false;
    submitBtn.innerText = "Declare Result";
  }
};
</script>


<script src="nav.js"></script>
</body>
</html>
