<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gali Disawar - Game Zone</title>
<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="global.css">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background:#f8fafc;
  color:#111827;
  padding-bottom:90px;
  overflow-x:hidden;
  position:relative;
}

/* BUBBLES */
body::before,
body::after{
  content:"";
  position:fixed;
  border-radius:50%;
  z-index:-1;
}

body::before{
  width:180px;
  height:180px;
  top:120px;
  right:-50px;
  background:rgba(0,255,136,0.08);
  animation:floatBubble 6s infinite ease-in-out;
}

body::after{
  width:140px;
  height:140px;
  bottom:120px;
  left:-40px;
  background:rgba(0,255,136,0.05);
  animation:floatBubble 8s infinite ease-in-out;
}

@keyframes floatBubble{
  50%{
    transform:translateY(25px);
  }
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(135deg,#021b14,#00a86b,#00ff88);
  padding:14px 18px;
  color:#fff;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 10px 30px rgba(0,255,136,0.25);
}

.header .logo{
  font-size:20px;
  font-weight:800;
}

.header .wallet{
  background:rgba(255,255,255,.15);
  padding:8px 14px;
  border-radius:20px;
  font-weight:700;
  backdrop-filter:blur(10px);
}

/* TOP BUTTONS */
.top-actions{
  display:flex;
  gap:12px;
  padding:16px;
}

.top-btn{
  flex:1;
  padding:13px;
  border:none;
  border-radius:14px;
  background:#fff;
  color:#111827;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,.08);
  transition:.3s;
}

.top-btn:hover{
  transform:translateY(-3px) scale(1.02);
}

.top-btn.primary{
  background:linear-gradient(135deg,#00a86b,#00d084);
  color:#fff;
}

/* GAME LIST */
.game-list{
  margin:16px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* GAME CARD */
.game-card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  border:1px solid #f1f5f9;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
  transition:.35s;
}

.game-card:hover{
  transform:translateY(-5px) scale(1.01);
  box-shadow:0 15px 35px rgba(0,168,107,.15);
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.game-info h3{
  margin:0;
  font-size:17px;
  color:#111827;
}

.game-info p{
  margin-top:5px;
  font-size:13px;
  color:#64748b;
}

.game-status{
  font-size:12px;
  font-weight:bold;
  color:#00a86b;
  margin-bottom:8px;
}

.game-status.closed{
  color:#ef4444;
}

.right-box{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:8px;
}

/* RESULT */
.result-pill{
  padding:8px 16px;
  border-radius:999px;
  font-weight:700;
  background:#f8fafc;
  border:1px solid #e2e8f0;
  color:#64748b;
}

.result-pill.has-result{
  color:#00a86b;
  border-color:#00a86b;
  box-shadow:0 0 14px rgba(0,168,107,.2);
}

/* PLAY BUTTON */
.play-btn{
  background:linear-gradient(135deg,#00a86b,#00d084);
  color:white;
  border:none;
  padding:10px 18px;
  border-radius:20px;
  cursor:pointer;
  font-weight:700;
  transition:.3s;
  box-shadow:0 8px 18px rgba(0,168,107,.25);
}

.play-btn:hover{
  transform:scale(1.05);
}

.play-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:72px;
  background:linear-gradient(135deg,#021b14,#00a86b);
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top-left-radius:18px;
  border-top-right-radius:18px;
  box-shadow:0 -6px 18px rgba(0,0,0,.18);
  z-index:999;
}

.bottom-nav .nav-item{
  flex:1;
  text-align:center;
  color:rgba(255,255,255,.75);
  font-size:11px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  transition:.25s;
}

.bottom-nav .nav-item i{
  font-size:20px;
  margin-bottom:4px;
}

.bottom-nav .nav-item.active{
  color:#fff;
  font-weight:700;
}
/* =========================================
PREMIUM GAME RATES
========================================= */

.rates-section {
margin: 16px;
padding: 18px;
background: #ffffff;
border: 1px solid #e5f3eb;
border-radius: 22px;
box-shadow: 0 10px 30px rgba(0, 80, 50, 0.06);
animation: ratesEntrance 0.7s ease both;
}

.rates-heading {
display: flex;
align-items: center;
justify-content: space-between;
gap: 10px;
margin-bottom: 18px;
}

.rates-heading h2 {
font-size: 19px;
color: #087f50;
font-weight: 800;
}

.rates-heading h2 i {
margin-right: 6px;
}

.rates-heading p {
margin-top: 5px;
font-size: 12px;
color: #64748b;
}

.rates-badge {
padding: 7px 10px;
border-radius: 10px;
background: #e9fff3;
color: #087f50;
font-size: 10px;
font-weight: 800;
letter-spacing: 0.5px;
}

.rates-grid {
display: grid;
grid-template-columns: 1fr;
gap: 13px;
}

.rate-card {
position: relative;
padding: 16px;
border: 1px solid #e6f1eb;
border-radius: 18px;
background: linear-gradient(135deg, #ffffff, #f5fff9);
transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.rate-card:hover {
transform: translateY(-4px);
box-shadow: 0 12px 25px rgba(0, 168, 107, 0.12);
}

.rate-icon {
width: 43px;
height: 43px;
display: flex;
align-items: center;
justify-content: center;
border-radius: 14px;
color: #ffffff;
font-size: 18px;
margin-bottom: 12px;
}

.single-icon {
background: linear-gradient(135deg, #00a86b, #00d084);
}

.jodi-icon {
background: linear-gradient(135deg, #087f50, #20c997);
}

.rate-info h3 {
color: #172b23;
font-size: 16px;
font-weight: 800;
}

.rate-info p {
margin-top: 4px;
color: #64748b;
font-size: 12px;
}

.rate-value {
display: flex;
align-items: center;
justify-content: space-between;
gap: 10px;
margin-top: 18px;
padding: 12px;
border-radius: 13px;
background: #eafff3;
}

.rate-value span {
font-size: 17px;
color: #334155;
font-weight: 700;
}

.rate-value i {
color: #00a86b;
font-size: 14px;
}

.rate-value strong {
color: #008653;
font-size: 23px;
font-weight: 800;
}

.rate-footer {
display: flex;
justify-content: space-between;
gap: 10px;
margin-top: 9px;
color: #64748b;
font-size: 11px;
}

.rates-note {
display: flex;
align-items: flex-start;
gap: 8px;
margin-top: 16px;
padding: 12px;
border-radius: 12px;
background: #f8fafc;
color: #64748b;
font-size: 11px;
line-height: 1.6;
}

.rates-note i {
color: #00a86b;
margin-top: 3px;
}

@keyframes ratesEntrance {
from {
opacity: 0;
transform: translateY(18px);
}


to {
    opacity: 1;
    transform: translateY(0);
}


}

@media (min-width: 600px) {
.rates-grid {
grid-template-columns: repeat(2, minmax(0, 1fr));
}
}

@media (prefers-reduced-motion: reduce) {
.rates-section {
animation: none;
}


.rate-card {
    transition: none;
}


}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">GALI DISAWAR</div>
  <div class="wallet">₹ <span id="wallet">0</span></div>
</div>

<!-- TOP ACTIONS -->
<div class="top-actions">
  <button class="top-btn primary" onclick="goPage('gali-history.html')">📜 My Gali Bets</button>
  <button class="top-btn" onclick="loadGaliGames()">🔄 Refresh</button>
</div>


<!-- GAME RATES -->

<section class="rates-section">
    <div class="rates-heading">
        <div>
            <h2><i class="fa-solid fa-chart-line"></i> Game Rates</h2>
            <p>Check the available game categories</p>
        </div>
        <span class="rates-badge">RATE CARD</span>
    </div>


<div class="rates-grid">

    <!-- SINGLE RATE -->
    <div class="rate-card">
        <div class="rate-icon single-icon">
            <i class="fa-solid fa-hashtag"></i>
        </div>

        <div class="rate-info">
            <h3>Single Digit</h3>
            <p>Choose one digit (0–9)</p>
        </div>

        <div class="rate-value">
            <span>₹10</span>
            <i class="fa-solid fa-arrow-right"></i>
            <strong>₹95</strong>
        </div>

        <div class="rate-footer">
            <span>Entry</span>
            <span>Displayed return</span>
        </div>
    </div>

    <!-- JODI RATE -->
    <div class="rate-card">
        <div class="rate-icon jodi-icon">
            <i class="fa-solid fa-table-cells"></i>
        </div>

        <div class="rate-info">
            <h3>Jodi</h3>
            <p>Choose a two-digit pair (00–99)</p>
        </div>

        <div class="rate-value">
            <span>₹10</span>
            <i class="fa-solid fa-arrow-right"></i>
            <strong>₹950</strong>
        </div>

        <div class="rate-footer">
            <span>Entry</span>
            <span>Displayed return</span>
        </div>
    </div>

</div>

<p class="rates-note">
    <i class="fa-solid fa-circle-info"></i>
    Rates shown are illustrative. Confirm the applicable rules before use.
</p>


</section>

<!-- GAME LIST -->
<div class="game-list" id="gameList"></div>


<script>
const token = localStorage.getItem("token");
const API = "https://tirupati-matka.onrender.com/api/gali/zone";




/* =========================
   LOAD WALLET
========================= */
async function loadWallet() {
  if (!token) return;

  try {
    const res = await fetch(
      "https://tirupati-matka.onrender.com/api/auth/balance",
      {
        headers: { Authorization: "Bearer " + token }
      }
    );

    const data = await res.json();
    if (data.success) {
      document.getElementById("wallet").innerText = data.balance;
    }
  } catch (err) {
    console.error("Wallet error:", err);
  }
}
loadWallet();

/* =========================
   TIME HELPERS
========================= */
/* =========================
   TIME HELPERS
========================= */

/* =========================
   TIME FORMAT HELPER
========================= */
function formatTime12(timeStr) {
  if (!timeStr) return "--:--";
  const [h, m] = timeStr.split(":").map(Number);
  const hh = h % 12 || 12;
  const ampm = h >= 12 ? "PM" : "AM";
  return `${hh.toString().padStart(2, "0")}:${m.toString().padStart(2, "0")} ${ampm}`;
}

/* =========================
   LOAD GALI GAMES
========================= */
async function loadGaliGames() {
  const token = localStorage.getItem("token");
  if (!token) return console.warn("Token missing!");

  try {
    const res = await fetch(API, {
      headers: { Authorization: "Bearer " + token }
    });
    const data = await res.json();
    console.log("API RESPONSE:", data);

    const gameList = document.getElementById("gameList");
    if (!gameList) return console.error("Element #gameList not found!");

    // No games available
    if (!data.success || !data.games?.length) {
      gameList.innerHTML = `<p style="text-align:center;color:#00eaff">No games available</p>`;
      return;
    }

    gameList.innerHTML = ""; // clear previous

    data.games.forEach(game => {
      const status = (game.bidStatus || "").trim().toLowerCase();

      // Determine if play is allowed
      const playAllowed =
        status === "open & close bids running".toLowerCase() ||
        status === "close bids running".toLowerCase();

      // Use API resultText directly
      const resultText = game.resultText ?? "--";

      console.log(
        "Game:", game.gameName,
        "Status:", game.bidStatus,
        "Play Allowed:", playAllowed,
        "Result:", resultText
      );

      // Create card
      const card = document.createElement("div");
      card.className = "game-card";
      card.innerHTML = `
        <div class="row">
          <div class="game-info">
            <div class="game-status ${playAllowed ? "running" : "closed"}">
              ${game.bidStatus}
            </div>
            <h3>${game.gameName}</h3>
            <p>${formatTime12(game.openTime)} – ${formatTime12(game.closeTime)}</p>
          </div>

          <div class="right-box">
            <button class="play-btn ${playAllowed ? "glow" : ""}" ${!playAllowed ? "disabled" : ""}>
              ${playAllowed ? "Play" : "Locked"}
            </button>
          </div>
        </div>

        <div class="result-mini">
          <div class="result-pill ${resultText !== "--" ? "has-result" : ""}">
            ${resultText}
          </div>
        </div>
      `;

      // Button click
      const playBtn = card.querySelector(".play-btn");
      playBtn.onclick = () => {
        if (!playAllowed) return;
        localStorage.setItem(
          "selectedGaliGame",
          JSON.stringify({
            gameId: game.gameId,
            gameName: game.gameName,
            openTime: game.openTime,
            closeTime: game.closeTime
          })
        );
        window.location.href = "galibettype.html";
      };

      gameList.appendChild(card);
    });

  } catch (err) {
    console.error("loadGaliGames error:", err);
    document.getElementById("gameList").innerHTML =
      `<p style="text-align:center;color:red">Failed to load games</p>`;
  }
}

/* =========================
   INITIAL LOAD
========================= */
loadGaliGames();

window.goPage = (page) => {
  location.href = page;
};

</script>



<script src="nav.js"></script>
</body>
</html>
