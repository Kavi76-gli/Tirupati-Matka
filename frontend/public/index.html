<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kalyan Master</title>

  <style>
    /* ===============================
       BASE
    =============================== */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: linear-gradient(160deg, #071526, #0b2a4a);
      font-family: "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ===============================
       SPLASH CONTAINER
    =============================== */
    .splash {
      text-align: center;
      animation: fadeIn 1s ease forwards;
    }

    /* ===============================
       APP NAME
    =============================== */
    .title {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(30px, 7vw, 56px);
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #00eaff;
    }

    .title span {
      display: inline-block;
      min-width: 1ch;
      opacity: 0;
      transform: translateY(12px) scale(0.9);
      animation: reveal 0.45s ease forwards;
    }

    .title span.space {
      width: 0.6em;
    }

    /* ===============================
       ANIMATIONS
    =============================== */
    @keyframes reveal {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0 }
      to { opacity: 1 }
    }
  </style>
</head>
<body>

  <div class="splash">
    <div class="title" id="title">
      <span>K</span>
      <span>A</span>
      <span>L</span>
      <span>Y</span>
      <span>A</span>
      <span>N</span>

      <span class="space"></span>

      <span>M</span>
      <span>A</span>
      <span>S</span>
      <span>T</span>
      <span>E</span>
      <span>R</span>
    </div>
  </div>

<script>
/* ===============================
   LETTER SEQUENCE
=============================== */
const letters = document.querySelectorAll("#title span:not(.space)");

letters.forEach((el, i) => {
  el.style.animationDelay = `${i * 0.08}s`;
});

/* ===============================
   LOGIN CHECK
=============================== */
const API = "https://kalyanmaster.onrender.com/api/auth";

setTimeout(checkLogin, 1800);

async function checkLogin() {
  const token = localStorage.getItem("token");

  if (!token) {
    redirect("auth.html");
    return;
  }

  try {
    const res = await fetch(API + "/me", {
      headers: { Authorization: "Bearer " + token }
    });

    if (!res.ok) throw new Error("Invalid");

    const data = await res.json();

    if (data.success) {
      redirect("gamezone.html");
    } else {
      localStorage.clear();
      redirect("auth.html");
    }
  } catch {
    localStorage.clear();
    redirect("auth.html");
  }
}

/* ===============================
   SMOOTH REDIRECT
=============================== */
function redirect(page) {
  document.body.style.transition = "opacity 0.6s";
  document.body.style.opacity = "0";
  setTimeout(() => location.replace(page), 600);
}
</script>

</body>
</html>
