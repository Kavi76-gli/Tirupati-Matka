
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tirupati Matka</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #ffffff 0%,
                    #eef7ff 50%,
                    #e8f2ff 100%
                );

            overflow: hidden;
        }

        /* ================================
           BACKGROUND GLOW
        ================================= */

        .bg1,
        .bg2 {
            position: absolute;

            border-radius: 50%;

            filter: blur(100px);

            pointer-events: none;
        }

        .bg1 {
            width: 300px;
            height: 300px;

            background: #00c3ff;

            opacity: 0.15;

            top: 15%;
            left: 15%;
        }

        .bg2 {
            width: 300px;
            height: 300px;

            background: #0066ff;

            opacity: 0.15;

            bottom: 15%;
            right: 15%;
        }

        /* ================================
           SPLASH
        ================================= */

        .splash {
            position: relative;

            z-index: 10;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ================================
           LOGO CONTAINER
        ================================= */

        .logo-wrapper {
            width: 220px;
            height: 220px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 40px;

            background: rgba(255, 255, 255, 0.65);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);

            animation: zoomIn 0.8s ease;
        }

        /* ================================
           LOGO
        ================================= */

        .logo {
            width: 180px;
            height: 180px;

            object-fit: contain;

            user-select: none;

            -webkit-user-drag: none;
        }

        /* ================================
           ANIMATION
        ================================= */

        @keyframes zoomIn {

            from {
                opacity: 0;

                transform:
                    scale(0.7);
            }

            to {
                opacity: 1;

                transform:
                    scale(1);
            }
        }
    </style>
</head>


<body>

    <!-- Background Glow -->
    <div class="bg1"></div>
    <div class="bg2"></div>


    <!-- Splash -->
    <div class="splash">

        <div class="logo-wrapper">

            <img
                src="Tirupati.png"
                class="logo"
                alt="Tirupati Matka"
            >

        </div>

    </div>


    <script>

        /*
        ======================================================
        TIRUPATI MATKA SPLASH ROUTING
        ======================================================

        EXISTING USER
        ----------------
        token / ki_token
        +
        valid saved user
        ↓
        mpin.html


        NEW USER
        ----------------
        no valid login
        ↓
        auth.html


        ======================================================
        */


        function clearLoginData() {

            localStorage.removeItem("token");

            localStorage.removeItem("ki_token");

            localStorage.removeItem("user");

        }


        function getSavedToken() {

            return (
                localStorage.getItem("token") ||
                localStorage.getItem("ki_token")
            );

        }


        function isValidUser(user) {

            if (!user || typeof user !== "object") {
                return false;
            }


            /*
            Support different user data
            structures used by the app.
            */

            const phone =
                user.phone ||
                user.mobile ||
                user.number;


            return Boolean(phone);

        }


        function checkUserAndRedirect() {

            const token = getSavedToken();

            const savedUser =
                localStorage.getItem("user");


            /*
            ==================================================
            EXISTING USER
            ==================================================
            */

            if (token && savedUser) {

                try {

                    const user =
                        JSON.parse(savedUser);


                    if (isValidUser(user)) {

                        console.log(
                            "Existing user detected."
                        );

                        console.log(
                            "Opening M-PIN login..."
                        );


                        window.location.replace(
                            "m-pin.html"
                        );


                        return;

                    }

                } catch (error) {

                    console.error(
                        "Invalid saved user data:",
                        error
                    );

                }

            }


            /*
            ==================================================
            INVALID / CORRUPTED LOGIN DATA
            ==================================================
            */

            clearLoginData();


            /*
            ==================================================
            NEW USER
            ==================================================
            */

            console.log(
                "No valid existing user found."
            );

            console.log(
                "Opening registration..."
            );


            window.location.replace(
                "auth.html"
            );

        }


        /*
        ======================================================
        SPLASH DELAY
        ======================================================

        1 second splash screen.
        */

        setTimeout(
            checkUserAndRedirect,
            1000
        );

    </script>

</body>

</html>
