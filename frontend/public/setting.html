<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - Kalyan Master</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.2/dist/tailwind.min.css" rel="stylesheet">
<link rel="stylesheet" href="global.css">
<style>
  body { background: #0a0f2c; color: #9bdfff; font-family: 'Arial', sans-serif; }
  .neon { text-shadow: 0 0 5px #0ff, 0 0 10px #0ff, 0 0 20px #0ff; }
  .card { background: rgba(0,0,0,0.5); border-radius: 15px; padding: 20px; margin: 15px 0; box-shadow: 0 0 15px #0ff; }
  button { background: #0ff; color: #000; font-weight: bold; padding: 8px 12px; border-radius: 8px; box-shadow: 0 0 10px #0ff; }
</style>
</head>
<body class="p-5">

<h1 class="text-3xl neon text-center mb-5">⚡ BattlePurse Settings</h1>

<div class="card">
  <h2 class="text-xl neon mb-2">Change Password</h2>
  <input type="password" id="oldPassword" placeholder="Old Password" class="w-full p-2 mb-2 rounded">
  <input type="password" id="newPassword" placeholder="New Password" class="w-full p-2 mb-2 rounded">
  <button onclick="changePassword()">Update Password</button>
</div>

<div class="card">
  <h2 class="text-xl neon mb-2">Update Contact</h2>
  <input type="text" id="name" placeholder="Name" class="w-full p-2 mb-2 rounded">
  <input type="text" id="phone" placeholder="Phone" class="w-full p-2 mb-2 rounded">
  <input type="email" id="email" placeholder="Email" class="w-full p-2 mb-2 rounded">
  <button onclick="updateContact()">Update Contact</button>
</div>

<div class="card">
  <h2 class="text-xl neon mb-2">Help & Contact</h2>
  <div id="helpData" class="mb-2"></div>
  <button onclick="getHelp()">Load Help Info</button>
</div>

<div class="card">
  <h2 class="text-xl neon mb-2">Logout</h2>
  <button onclick="logout()">Logout</button>
</div>

<script>

const token = localStorage.getItem("token");

async function changePassword() {
  const oldPassword = document.getElementById("oldPassword").value;
  const newPassword = document.getElementById("newPassword").value;
  const res = await fetch("https://kalyanmaster.onrender.com/api/auth/settings/change-password", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
    body: JSON.stringify({ oldPassword, newPassword })
  });
  const data = await res.json();
  alert(data.msg);
}

async function updateContact() {
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const email = document.getElementById("email").value;
  const res = await fetch("https://kalyanmaster.onrender.com/api/auth/settings/update-contact", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
    body: JSON.stringify({ name, phone, email })
  });
  const data = await res.json();
  alert(data.msg);
}

async function getHelp() {
  const res = await fetch("https://kalyanmaster.onrender.com/api/auth/settings/help", {
    headers: { Authorization: "Bearer " + token }
  });
  const data = await res.json();
  document.getElementById("helpData").innerHTML = `
    Email: ${data.help.supportEmail}<br>
    Phone: ${data.help.contactNumber}<br>
    FAQ: <a href="${data.help.faqLink}" target="_blank" class="text-blue-400">Click Here</a>
  `;
}

async function logout() {
  const res = await fetch("https://kalyanmaster.onrender.com/api/auth/settings/logout", {
    method: "POST",
    headers: { Authorization: "Bearer " + token }
  });
  const data = await res.json();
  if (data.success) {
    localStorage.removeItem("token");
    alert(data.msg);
    window.location.href = "../auth.html";
  }
}
</script>
<script src="nav.js"></script>
</body>
</html>
