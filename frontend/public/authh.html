<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Authentication</title>


<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.top-bg{
    position:absolute;
    top:0;
    width:100%;
    height:280px;
    background:linear-gradient(135deg,#007a55,#00c778);
    border-bottom-left-radius:40px;
    border-bottom-right-radius:40px;
}

.auth-container{
    position:relative;
    width:95%;
    max-width:420px;
    min-height:620px;
    background:white;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
    overflow:hidden;
}

.page{
    position:absolute;
    width:100%;
    padding:40px 30px;
    opacity:0;
    transform:translateX(100%);
    transition:all 0.5s ease;
}

.page.active{
    opacity:1;
    transform:translateX(0);
}

h2{
    text-align:center;
    margin-bottom:35px;
    color:#00a56b;
}

.input-box{
    margin-bottom:18px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #00b86f;
    border-radius:12px;
    outline:none;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    background:#00b86f;
    border:none;
    color:white;
    font-size:18px;
    border-radius:12px;
    cursor:pointer;
    margin-top:20px;
}

button:hover{
    background:#009b5d;
}

p{
    text-align:center;
    margin-top:18px;
    cursor:pointer;
}

.link{
    color:#00a56b;
    font-weight:bold;
}

.small{
    font-size:14px;
}
.auth-container{
    position:relative;
    width:95%;
    max-width:420px;
    min-height:700px;
    background:white;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
    overflow:hidden;
}
</style>

<body>

<div class="top-bg"></div>

<div class="auth-container">

    <!-- LOGIN -->
    <div class="page active" id="loginPage">
        <h2>Sign In</h2>

        <div class="input-box">
            <input id="loginPhone" placeholder="Phone Number">
        </div>

        <div class="input-box">
            <input id="loginPassword" type="password" placeholder="Password">
        </div>

        <button id="loginBtn">Sign In</button>

        <p class="small" onclick="showPage('forgotPage')">Forgot Password?</p>
        <p class="small" onclick="showPage('forgotMpinPage')">Forgot MPIN?</p>

        <p class="small">
            Don't have account?
            <span class="link" onclick="showPage('signupPage')">Create Account</span>
        </p>
    </div>

    <!-- SIGNUP -->
    <div class="page" id="signupPage">
        <h2>Create Account</h2>

        <div class="input-box">
            <input id="name" placeholder="Full Name">
        </div>

        <div class="input-box">
            <input id="phone" placeholder="Phone Number">
        </div>

        <div class="input-box">
            <input id="password" type="password" placeholder="Password">
        </div>

        <div class="input-box">
            <input id="mpin" placeholder="MPIN">
        </div>

        <div class="input-box">
            <input id="referral" placeholder="Referral Code (Optional)">
        </div>

        <button id="sendOtpBtn">Send OTP</button>

        <p class="small">
            Already have account?
            <span class="link" onclick="showPage('loginPage')">Sign In</span>
        </p>
    </div>

    <!-- OTP -->
    <div class="page" id="otpPage">
        <h2>Verify OTP</h2>

        <div class="input-box">
            <input id="otp" placeholder="Enter OTP">
        </div>

        <button id="verifyBtn">Verify OTP</button>
    </div>

    <!-- FORGOT PASSWORD -->
    <div class="page" id="forgotPage">
        <h2>Forgot Password</h2>

        <div class="input-box">
            <input id="forgotPhone" placeholder="Phone Number">
        </div>

        <button id="forgotBtn">Send OTP</button>

        <p class="small">
            <span class="link" onclick="showPage('loginPage')">Back to Login</span>
        </p>
    </div>

    <!-- RESET PASSWORD -->
    <div class="page" id="resetPage">
        <h2>Reset Password</h2>

        <div class="input-box">
            <input id="newPassword" type="password" placeholder="New Password">
        </div>

        <button id="resetBtn">Reset Password</button>
    </div>

    <!-- FORGOT MPIN -->
    <div class="page" id="forgotMpinPage">
        <h2>Reset MPIN</h2>

        <div class="input-box">
            <input id="forgotMpinPhone" placeholder="Phone Number">
        </div>

        <div class="input-box">
            <input id="newMpin" placeholder="New MPIN">
        </div>

        <button id="resetMpinBtn">Reset MPIN</button>

        <p class="small">
            <span class="link" onclick="showPage('loginPage')">Back to Login</span>
        </p>
    </div>

</div>

<div id="recaptcha-container"></div>


</body>



<script>
function showPage(pageId){
    document.querySelectorAll(".page").forEach(page=>{
        page.classList.remove("active");
    });

    setTimeout(()=>{
        document.getElementById(pageId).classList.add("active");
    },100);
}
</script>

<script type="module" src="js/authh.js"></script>

</body>
</html>
