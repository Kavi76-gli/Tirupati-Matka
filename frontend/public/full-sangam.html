<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Sangam</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="global.css">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",sans-serif;
}

body{
  background:radial-gradient(circle at top,#081a33,#020b18);
  color:#e6f1ff;
  padding-bottom:90px;
}

/* ================= HEADER ================= */
/* HEADER */
.header {
  height: 76px;
  background: linear-gradient(180deg, #000000, #050505);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  border-bottom: 1px solid rgba(212,175,55,0.45);
}

/* LOGO AREA */
.logo {
  display: flex;
  align-items: center;
}

/* LOGO IMAGE – CLEAR & PREMIUM */
.logo img {
  height: 64px;          /* 🔥 bigger = clarity */
  width: auto;
  object-fit: contain;
  filter: 
    contrast(1.25)
    brightness(1.15);
}


/* RIGHT ICONS */
.header-icons {
  display: flex;
  align-items: center;
  gap: 14px;
}

/* ICON STYLE */
.header-icons i {
  font-size: 20px;
  color: #d4af37;             /* gold tone */
  cursor: pointer;
}

/* BALANCE */
.balance {
  background: linear-gradient(135deg, #b8962e, #f3da8c);
  color: #2b1a00;
  padding: 6px 14px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 700;
}
/* ================= MARKET ================= */
.market-card{
  margin:14px;
  padding:14px;
  background:#021126;
  border-radius:16px;
  display:flex;
  align-items:center;
  box-shadow:0 0 12px #00eaff33;
}

.market-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.icon{
  width:48px;
  height:48px;
  border-radius:14px;
  background:linear-gradient(135deg,#0d47ff,#00eaff);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
  font-weight:bold;
}

.market-left h3{ font-size:16px }
.market-left p{ font-size:13px;color:#9fdfff }

/* ================= FORM ================= */
.form-card{
  margin:14px;
  padding:14px;
  background:#021126;
  border-radius:16px;
  box-shadow:0 0 10px #00eaff22;
}

.field h4{ font-size:15px;margin-bottom:4px }
.field p{ font-size:12px;color:#9fdfff;margin-bottom:8px }

.field input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #00eaff44;
  background:#000c1f;
  color:#00eaff;
  font-size:16px;
  outline:none;
}

.field input::placeholder{ color:#6fa9cc }

/* ================= SUBMIT ================= */
.submit-box{ margin:20px 14px }

.submit-box button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:30px;
  font-size:18px;
  font-weight:bold;
  background:linear-gradient(90deg,#00bfff,#0d47ff);
  color:#fff;
  cursor:pointer;
  box-shadow:0 0 18px #00eaff66;
}

/* ================= BOTTOM NAV ================= */
.bottom-nav{
  position:fixed;
  bottom:0;
  width:100%;
  height:70px;
  background:#021126;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid #00eaff33;
}

.nav-item{
  text-align:center;
  font-size:12px;
  color:#9fdfff;
}

.nav-item i{
  font-size:18px;
  display:block;
  margin-bottom:4px;
}

.nav-item.center{
  background:linear-gradient(135deg,#00bfff,#0d47ff);
  padding:12px 18px;
  border-radius:20px;
  color:#fff;
}

/* =====================
   SIDE MENU (BLUE NEON)
===================== */
.side-menu {
  position: fixed;
  top: 0;
  right: -280px;
  width: 280px;
  height: 100%;
  background: linear-gradient(180deg, #0a1f4d, #050c2a);
  box-shadow: -8px 0 28px rgba(0, 153, 255, 0.35);
  transition: 0.35s ease;
  z-index: 9999;
  border-top-left-radius: 18px;
  border-bottom-left-radius: 18px;
  overflow: hidden;
}

.side-menu.active {
  right: 0;
}

/* MENU HEADER */
.menu-header {
  padding: 16px;
  background: linear-gradient(135deg, #0d47ff, #00bfff);
  color: #ffffff;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 4px 18px rgba(0, 191, 255, 0.5);
}

.menu-header h3 {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.4px;
}

/* CLOSE BUTTON */
.close-btn {
  background: rgba(255, 255, 255, 0.15);
  border: none;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  font-size: 20px;
  color: #ffffff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.2s ease;
}

.close-btn:hover {
  background: rgba(255, 255, 255, 0.3);
}

/* MENU LIST */
.menu-list {
  list-style: none;
  padding: 10px 0;
  margin: 0;
}

.menu-list li {
  padding: 14px 20px;
  color: #e6f1ff;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: 0.25s ease;
}

.menu-list li:hover {
  background: rgba(0, 191, 255, 0.12);
  padding-left: 26px;
  color: #00eaff;
}

.menu-list li.active {
  background: rgba(0, 191, 255, 0.18);
  color: #00eaff;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">
    <img src="ka.jpeg" alt="Kalyan Master Logo">
  </div>

  <div class="header-icons">
    <i class="fa-solid fa-bell" onclick="goPage('notification.html')"></i>

    <div class="balance" id="balance">₹0.00</div>

    <i class="fa-solid fa-bars" onclick="toggleMenu()"></i>
  </div>
</div>

<!-- MARKET -->
<div class="market-card">
  <div class="market-left">
    <div class="icon">F</div>
    <div>
      <h3 id="marketName">MARKET</h3>
      <p id="betInfoText">Full Sangam</p>
    </div>
  </div>
</div>

<!-- OPEN PANNA -->
<div class="form-card">
  <div class="field">
    <h4>Open Panna</h4>
    <p>Enter 3 digits (000–999)</p>
    <input 
      type="number" 
      id="openPanna" 
      placeholder="Open Panna" 
      min="0" max="999" 
      oninput="this.value = this.value.slice(0,3)"
    >
  </div>
</div>

<!-- CLOSE PANNA -->
<div class="form-card">
  <div class="field">
    <h4>Close Panna</h4>
    <p>Enter 3 digits (000–999)</p>
    <input 
      type="number" 
      id="closePanna" 
      placeholder="Close Panna" 
      min="0" max="999" 
      oninput="this.value = this.value.slice(0,3)"
    >
  </div>
</div>

<!-- AMOUNT -->
<div class="form-card">
  <div class="field">
    <h4>Amount</h4>
    <p>Minimum ₹10</p>
    <input type="number" id="amount" placeholder="Amount" min="10">
  </div>
</div>

<!-- SUBMIT -->
<div class="submit-box">
  <button onclick="submitFullSangam()">Submit Bid</button>
</div>

<!-- ================= SIDE MENU ================= -->
<div class="side-menu" id="sideMenu">
  <div class="menu-header">
    <h3>Menu</h3>
    <button class="close-btn" onclick="toggleMenu()">×</button>
  </div>

  <ul class="menu-list">
    <li onclick="go('profile.html')">Profile</li>
    <li onclick="go('add-fund.html')">Deposit</li>
    <li onclick="go('withdraw.html')">Withdraw</li>
    <li onclick="go('transition.html')">Transactions</li>
    <li onclick="go('gamezone.html')">Game Zone</li>
     <li onclick="go('reer.html')">Refer & Earn</li>
    <li onclick="go('history.html')">History</li>
    <li onclick="go('ratio.html')">Ratios</li>
    <li onclick="go('logout.html')">Logout</li>
  </ul>
</div>
<!-- BOTTOM NAV -->

<div class="bottom-nav">
  <div class="nav-item" data-page="reer.html">
    <i class="fa-solid fa-user"></i>
    <span>Refer</span>
  </div>

  <div class="nav-item" data-page="history.html">
    <i class="fa-solid fa-clock"></i>
    <span>Bid History</span>
  </div>

  <div class="nav-item center" data-page="gamezone.html">
    <i class="fa-solid fa-house"></i>
    <span>Home</span>
  </div>

  <div class="nav-item" data-page="my-transition.html">
    <i class="fa-solid fa-gavel"></i>
    <span>Transaction</span>
  </div>

  <div class="nav-item" data-page="wallet.html">
    <i class="fa-solid fa-wallet"></i>
    <span>Wallet</span>
  </div>

  <div class="active-indicator"></div>
</div>


<script>
/* ======================================================
   CONFIG
====================================================== */
const API = "https://kalyanmaster.onrender.com/api/auth";
const token = localStorage.getItem("token");

/* ======================================================
   LOAD BALANCE
====================================================== */
async function loadBalance() {
  try {
    const res = await fetch(API + "/balance", {
      headers: { Authorization: "Bearer " + token }
    });
    const data = await res.json();

    const balanceEl = document.getElementById("balance");
    if (data.success && balanceEl) {
      balanceEl.innerText = "₹" + data.balance;
    }
  } catch (e) {
    console.error("Balance error:", e);
  }
}
loadBalance();

/* ======================================================
   LOAD BET INFO
====================================================== */
let bet = null;
try {
  bet = JSON.parse(localStorage.getItem("betInfo"));
} catch {
  bet = null;
}

if (!bet || !bet.gameId) {
  alert("No game selected");
  location.href = "play.html";
}

/* ======================================================
   BASIC UI SETUP
====================================================== */
const marketNameEl = document.getElementById("marketName");
const betInfoTextEl = document.getElementById("betInfoText");

if (marketNameEl) {
  marketNameEl.innerText = bet.gameName;
}

if (betInfoTextEl) {
  betInfoTextEl.innerText = `Full Sangam • ${bet.betFor.toUpperCase()}`;
}

/* ======================================================
   INPUT REFERENCES
====================================================== */
const openPannaInput  = document.getElementById("openPanna");
const closePannaInput = document.getElementById("closePanna");
const amountInput     = document.getElementById("amount");

/* ======================================================
   VALIDATION
====================================================== */
function isValidPanna(v) {
  return v !== "" && !isNaN(v) && v >= 0 && v <= 999;
}

/* ======================================================
   SUBMIT FULL SANGAM (ONLY ONE FUNCTION)
====================================================== */
function submitFullSangam() {
  const openPanna  = openPannaInput?.value.trim();
  const closePanna = closePannaInput?.value.trim();
  const amount     = Number(amountInput?.value);

  // ================= VALIDATION =================
  if (!openPanna || !isValidPanna(openPanna)) {
    return alert("Enter valid Open Panna (000–999)");
  }
  if (!closePanna || !isValidPanna(closePanna)) {
    return alert("Enter valid Close Panna (000–999)");
  }
  if (!amount || amount < 10) {
    return alert("Minimum amount ₹10");
  }

  // ================= PENDING BET =================
  const pendingBet = {
    matchId: bet?.gameId || null,
    gameName: bet?.gameName || "Unknown Game",
    betType: "fullsangam",
    betFor: bet?.betFor || "open",
    bids: [{
      number: `${openPanna}-${closePanna}`,
      openPanna,
      closePanna,
      amount
    }],
    totalAmount: amount
  };

  // ================= SAVE & NAVIGATE =================
  localStorage.setItem("pendingBet", JSON.stringify(pendingBet));
  location.href = "bid-details.html";
}


/* ======================================================
   COMMON UI
====================================================== */
function go(page) {
  location.href = page;
}
function toggleMenu() {
  document.getElementById("sideMenu").classList.toggle("active");
}
</script>


<script src="nav.js"></script>
</body>
</html>
