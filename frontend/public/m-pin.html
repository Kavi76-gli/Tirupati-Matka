
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#07965b">
<title>Tirupati Matka | Secure M-PIN</title>

<style>
:root {
    --green: #07965b;
    --green-dark: #057747;
    --green-light: #e9f9f0;
    --text: #172b22;
    --muted: #78877f;
    --border: #e5eee8;
    --white: #ffffff;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    background: linear-gradient(145deg, #f0fbf4, #ffffff 55%, #eaf8ef);
    color: var(--text);
}

.mobile {
    width: 100%;
    max-width: 390px;
    min-height: min(740px, calc(100dvh - 32px));
    position: relative;
    overflow: hidden;
    background: var(--white);
    border: 1px solid rgba(7, 150, 91, .10);
    border-radius: 30px;
    box-shadow: 0 20px 65px rgba(17, 80, 48, .12);
    display: flex;
    flex-direction: column;
}

.header {
    min-height: 190px;
    padding: 30px 24px 58px;
    position: relative;
    overflow: hidden;
    color: white;
    background: linear-gradient(135deg, #075b3a, #07965b 65%, #21bd78);
}

.header::after {
    content: "";
    position: absolute;
    width: 190px;
    height: 190px;
    right: -75px;
    top: -95px;
    border: 30px solid rgba(255,255,255,.08);
    border-radius: 50%;
    pointer-events: none;
}

.logo-box {
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    z-index: 1;
}

.logo {
    width: 58px;
    height: 58px;
    border-radius: 17px;
    object-fit: contain;
    background: white;
    padding: 5px;
    box-shadow: 0 8px 22px rgba(0,0,0,.12);
}

.brand h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -.5px;
}

.brand p {
    margin-top: 5px;
    font-size: 12px;
    opacity: .85;
}

.secure-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-top: 22px;
    padding: 8px 12px;
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 30px;
    background: rgba(255,255,255,.12);
    font-size: 11px;
    font-weight: 600;
}

.card {
    position: relative;
    z-index: 2;
    margin: -34px 15px 20px;
    padding: 26px 22px 24px;
    background: white;
    border: 1px solid #edf3ef;
    border-radius: 25px;
    box-shadow: 0 12px 35px rgba(17, 80, 48, .09);
    animation: cardIn .35s ease-out both;
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.card h2 {
    text-align: center;
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -.6px;
}

.subtitle {
    margin-top: 8px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
}

.pin-dots {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 26px 0 20px;
}

.dot {
    width: 15px;
    height: 15px;
    border: 2px solid #dce8e0;
    border-radius: 50%;
    background: #f5f8f6;
    transition: background .15s, border-color .15s, transform .15s;
}

.dot.active {
    background: var(--green);
    border-color: var(--green);
    transform: scale(1.12);
    box-shadow: 0 0 0 4px rgba(7,150,91,.10);
}

.status {
    min-height: 20px;
    margin: 0 0 12px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
}

.status.error {
    color: #dc2626;
}

.status.success {
    color: var(--green-dark);
}

.keypad {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 11px;
}

.key {
    height: 57px;
    border: 1px solid #edf2ee;
    border-radius: 16px;
    background: #f8fbf9;
    color: #20352a;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
    transition: background .12s, transform .12s;
}

.key:active {
    transform: scale(.95);
    background: #e5f7ed;
}

.key.action {
    color: var(--green-dark);
    background: var(--green-light);
    font-size: 20px;
}

.key:disabled {
    opacity: .55;
    cursor: wait;
}

.key.empty {
    visibility: hidden;
}

.forgot-mpin {
    margin-top: 19px;
    text-align: center;
}

.forgot-mpin a {
    display: inline-block;
    padding: 8px 12px;
    border-radius: 10px;
    color: var(--green-dark);
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
}

.forgot-mpin a:active {
    background: var(--green-light);
}

.footer {
    margin-top: auto;
    padding: 0 15px 20px;
    text-align: center;
    color: #93a198;
    font-size: 11px;
}

.shake {
    animation: shake .25s ease;
}

@keyframes shake {
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-3px); }
}

@media (max-height: 650px) {
    body {
        padding: 8px;
        align-items: flex-start;
    }

    .mobile {
        min-height: calc(100dvh - 16px);
    }

    .header {
        min-height: 145px;
        padding: 20px 20px 48px;
    }

    .secure-badge {
        margin-top: 12px;
    }

    .card {
        padding: 18px;
        margin-top: -28px;
    }

    .pin-dots {
        margin: 17px 0 12px;
    }

    .keypad {
        gap: 8px;
    }

    .key {
        height: 45px;
    }

    .forgot-mpin {
        margin-top: 10px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<main class="mobile">

    <header class="header">
        <div class="logo-box">
            <img
                src="Tirupati.png"
                class="logo"
                alt="Tirupati Matka logo"
                onerror="this.style.display='none'"
            >

            <div class="brand">
                <h1>Tirupati Matka</h1>
                <p>Secure Gaming Platform</p>
            </div>
        </div>

        <div class="secure-badge">
            <span>●</span>
            <span>Secure 4-digit authentication</span>
        </div>
    </header>

    <section class="card" id="app">

        <h2>Welcome Back</h2>

        <p class="subtitle">
            Enter your 4-digit M-PIN to continue
        </p>

        <div class="pin-dots" aria-label="M-PIN entry progress">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>

        <p class="status" id="status" role="status" aria-live="polite">
            Enter your secure M-PIN
        </p>

        <div class="keypad" id="keypad">

            <button class="key" type="button" data-key="1">1</button>
            <button class="key" type="button" data-key="2">2</button>
            <button class="key" type="button" data-key="3">3</button>

            <button class="key" type="button" data-key="4">4</button>
            <button class="key" type="button" data-key="5">5</button>
            <button class="key" type="button" data-key="6">6</button>

            <button class="key" type="button" data-key="7">7</button>
            <button class="key" type="button" data-key="8">8</button>
            <button class="key" type="button" data-key="9">9</button>

            <button class="key action" type="button" data-key="backspace"
                    aria-label="Delete last digit">⌫</button>

            <button class="key" type="button" data-key="0">0</button>

            <button class="key action" type="button" data-key="clear"
                    aria-label="Clear M-PIN">C</button>

        </div>

        <div class="forgot-mpin">
            <a href="forgot-mpin.html">Forgot M-PIN?</a>
        </div>

    </section>

    <footer class="footer">
        Protect your M-PIN. Never share it with anyone.
    </footer>

</main>

<script>
"use strict";

const API_URL = "https://tirupati-matka.onrender.com/api/auth";
const LOGIN_URL = `${API_URL}/login-mpin`;

const pinDots = document.querySelectorAll(".dot");
const keypad = document.getElementById("keypad");
const app = document.getElementById("app");
const statusBox = document.getElementById("status");

let pin = "";
let isVerifying = false;
let requestController = null;

function setStatus(message, type = "") {
    statusBox.textContent = message;
    statusBox.className = "status" + (type ? " " + type : "");
}

function updateDots() {
    pinDots.forEach((dot, index) => {
        dot.classList.toggle("active", index < pin.length);
    });
}

function resetPin() {
    pin = "";
    updateDots();
}

function setKeypadDisabled(disabled) {
    keypad.querySelectorAll("button").forEach(button => {
        button.disabled = disabled;
    });
}

function shakeCard() {
    app.classList.remove("shake");
    void app.offsetWidth;
    app.classList.add("shake");
}

function getStoredUser() {
    try {
        const raw = localStorage.getItem("user");
        return raw ? JSON.parse(raw) : null;
    } catch {
        return null;
    }
}

function getUserPhone() {
    const user = getStoredUser();

    if (!user) return "";

    return String(
        user.phone || user.mobile || user.number || ""
    ).replace(/\D/g, "").slice(-10);
}

async function verifyPin() {
    if (pin.length !== 4 || isVerifying) return;

    const submittedPin = pin;
    const phone = getUserPhone();

    if (!/^[6-9]\d{9}$/.test(phone)) {
        resetPin();
        setStatus("Your saved mobile number is missing. Please log in again.", "error");
        setTimeout(() => {
            location.replace("auth.html");
        }, 700);
        return;
    }

    isVerifying = true;
    setKeypadDisabled(true);
    setStatus("Verifying your M-PIN…");

    requestController = new AbortController();

    // Stop waiting indefinitely if the backend does not respond.
    const timeoutId = setTimeout(() => {
        requestController.abort();
    }, 20000);

    try {
        const response = await fetch(LOGIN_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                phone: phone,
                mpin: submittedPin
            }),
            signal: requestController.signal
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            resetPin();
            updateDots();
            shakeCard();

            const message =
                data.message ||
                data.msg ||
                "Incorrect M-PIN. Please try again.";

            const remaining = data.remainingAttempts;

            setStatus(
                remaining !== undefined
                    ? `${message} ${remaining} attempt(s) remaining.`
                    : message,
                "error"
            );

            return;
        }

        if (!data.token) {
            resetPin();
            setStatus("Login failed: the server did not return an authentication token.", "error");
            return;
        }

        // Save the authentication token only after successful verification.
        localStorage.setItem("token", data.token);
        localStorage.setItem("ki_token", data.token);

        if (data.user) {
            localStorage.setItem("user", JSON.stringify(data.user));
        }

        setStatus("Login successful. Opening your dashboard…", "success");

        // Navigate immediately; no artificial success delay.
        location.replace("gamezone.html");

    } catch (error) {
        resetPin();

        if (error.name === "AbortError") {
            setStatus(
                "The server took too long to respond. Please try again.",
                "error"
            );
        } else {
            console.error("M-PIN login error:", error);
            setStatus(
                "Unable to connect. Check your internet and try again.",
                "error"
            );
        }

    } finally {
        clearTimeout(timeoutId);
        requestController = null;
        isVerifying = false;
        setKeypadDisabled(false);
        updateDots();
    }
}

function handleKey(value) {
    if (isVerifying) return;

    if (value === "backspace") {
        pin = pin.slice(0, -1);
        updateDots();
        setStatus("Enter your 4-digit M-PIN");
        return;
    }

    if (value === "clear") {
        resetPin();
        setStatus("Enter your 4-digit M-PIN");
        return;
    }

    if (!/^\d$/.test(value) || pin.length >= 4) return;

    pin += value;
    updateDots();

    if (pin.length === 4) {
        verifyPin();
    }
}

keypad.addEventListener("click", event => {
    const button = event.target.closest("button[data-key]");
    if (!button) return;

    handleKey(button.dataset.key);
});

document.addEventListener("keydown", event => {
    if (event.ctrlKey || event.altKey || event.metaKey) return;

    if (/^\d$/.test(event.key)) {
        handleKey(event.key);
    } else if (event.key === "Backspace") {
        handleKey("backspace");
    } else if (event.key === "Escape") {
        handleKey("clear");
    }
});

updateDots();
</script>

</body>
</html>
