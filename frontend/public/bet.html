<style>

/* =====================================================
   GOOGLE FONT
===================================================== */

@import url(

/* =====================================================
   GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html{

}

body{

    position:relative;

/* =====================================================
   PAGE ANIMATION
===================================================== */

@keyframes pageOpen{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =====================================================
   BACKGROUND EFFECT
===================================================== */

body::before{

    content:"";

    position:fixed;

    width:220px;
    height:220px;

    background:rgba(0,168,107,.10);

    border-radius:50%;

    top:-80px;
    left:-80px;

    filter:blur(60px);

    z-index:-1;

    animation:bubble1 8s infinite ease-in-out;
}

body::after{

    content:"";

    position:fixed;

    width:250px;
    height:250px;

    background:rgba(0,216,125,.10);

    border-radius:50%;

    right:-100px;
    bottom:-100px;

    filter:blur(70px);

    z-index:-1;

    animation:bubble2 10s infinite ease-in-out;
}

@keyframes bubble1{

    50%{

    }
}

/* =====================================================

===================================================== */

.market-card,

/* =====================================================

===================================================== */

.toggle-box{

<script>

/* =====================================================
   API
===================================================== */

const API = "https://tirupati-matka.onrender.com/api";


/* =====================================================
   TOKEN
===================================================== */

function getToken(){

    return (
        localStorage.getItem("token") ||
        localStorage.getItem("ki_token") ||
        ""
    );

}

let token = getToken();



/* =====================================================
   GLOBALS
===================================================== */

let bid = null;

let bidListData = [];

let countdownInterval = null;

let gameRefreshInterval = null;



/* =====================================================
   DOM
===================================================== */

const openBtn =
    document.getElementById("openBtn");

const closeBtn =
    document.getElementById("closeBtn");

const toggleBox =
    document.getElementById("toggleBox");

const digit =
    document.getElementById("digit");

const singleDigit =
    document.getElementById("singleDigit");

const halfPanna =
    document.getElementById("halfPanna");

const openPanna =
    document.getElementById("openPanna");

const closePanna =
    document.getElementById("closePanna");

const amount =
    document.getElementById("amount");

const bidList =
    document.getElementById("bidList");

const loader =
    document.getElementById("loader");



/* =====================================================
   LOADER
===================================================== */

function showLoader(){

    if(loader){
        loader.classList.add("active");
    }

}


function hideLoader(){

    if(loader){
        loader.classList.remove("active");
    }

}



/* =====================================================
   LOAD BALANCE
===================================================== */

async function loadBalance(){

    const currentToken = getToken();

    if(!currentToken){

        console.log("No token found");

        return;
    }

    try{

        const response =
            await fetch(
                API + "/auth/balance",
                {
                    headers:{
                        Authorization:
                            "Bearer " +
                            currentToken
                    }
                }
            );


        if(!response.ok){

            console.log(
                "Balance HTTP Error:",
                response.status
            );

            return;
        }


        const data =
            await response.json();


        if(data.success){

            const balanceBox =
                document.getElementById(
                    "walletBalance"
                );


            if(balanceBox){

                balanceBox.innerText =
                    "₹" +
                    Math.floor(
                        Number(data.balance) || 0
                    );

            }

        }

    }
    catch(error){

        console.error(
            "Balance Error:",
            error
        );

    }

}



/* =====================================================
   LOAD BET INFO
===================================================== */

function loadBetInfo(){

    try{

        const stored =
            localStorage.getItem(
                "betInfo"
            );

        if(!stored){

            alert(
                "No game selected."
            );

            window.location.href =
                "gamezone.html";

            return false;
        }


        bid =
            JSON.parse(stored);


        if(
            !bid ||
            !bid.gameId
        ){

            alert(
                "Invalid game information."
            );

            window.location.href =
                "gamezone.html";

            return false;
        }


        console.log(
            "BET INFO:",
            bid
        );


        return true;

    }
    catch(error){

        console.error(
            "Bet Info Error:",
            error
        );

        alert(
            "Unable to load game."
        );

        window.location.href =
            "gamezone.html";

        return false;
    }

}



/* =====================================================
   TIME FORMAT
===================================================== */

function formatTime12(time){

    if(!time){

        return "--:--";
    }


    try{

        let date;


        if(
            typeof time === "string" &&
            time.includes("T")
        ){

            date =
                new Date(time);

        }
        else if(
            typeof time === "string" &&
            /AM|PM/i.test(time)
        ){

            date =
                new Date(
                    new Date().toDateString()
                    + " "
                    + time
                );

        }
        else{

            const parts =
                String(time)
                .split(":")
                .map(Number);


            date = new Date();

            date.setHours(
                parts[0] || 0,
                parts[1] || 0,
                0,
                0
            );

        }


        let hours =
            date.getHours();

        const minutes =
            date.getMinutes();


        const ampm =
            hours >= 12
                ? "PM"
                : "AM";


        hours =
            hours % 12 || 12;


        return (
            String(hours).padStart(2,"0")
            +
            ":"
            +
            String(minutes).padStart(2,"0")
            +
            " "
            +
            ampm
        );

    }
    catch{

        return "--:--";

    }

}



/* =====================================================
   SETUP UI
===================================================== */

            "gameType"
        );

    const marketTime =
        document.getElementById(
            "marketTime"
        );


    const gameName =
        bid.gameName ||
        "MARKET";


    const betType =
        String(
            bid.betType || "single"
        )
        .toLowerCase();


    if(marketName){

        marketName.innerText =
            gameName;

    }


    if(marketTitle){

        marketTitle.innerText =
            gameName +
            " (" +
            betType.toUpperCase() +
            ")";

    }


    if(marketIcon){

        marketIcon.innerText =
            gameName
            .charAt(0)
            .toUpperCase();

    }


    if(gameIcon){

        gameIcon.innerText =
            betType
            .charAt(0)

/* =====================================================
   CREATE TIME TODAY
===================================================== */

function getTodayTime(time){

    const date =
        new Date();


    if(!time){

        return date;
    }


    if(
        String(time).includes("T")
    ){

        return new Date(time);
    }


    const parts =
        String(time)
        .split(":")
        .map(Number);


    date.setHours(
        parts[0] || 0,
        parts[1] || 0,
        0,
        0
    );


    return date;

}



/* =====================================================
   GET GAME TIME RANGE
===================================================== */

function getGameTimes(game){

    const now =
        new Date();


    let openTime =
        getTodayTime(
            game.openTime
        );


    let closeTime =
        getTodayTime(
            game.closeTime
        );


    /*
       If close is earlier than open,
       close is next day.
    */

    if(
        closeTime <= openTime
    ){

        closeTime.setDate(
            closeTime.getDate() + 1
        );

    }


    /*
       If both times are already
       completely in the past,
       use tomorrow.
    */

    if(
        closeTime < now
    ){

        openTime.setDate(
            openTime.getDate() + 1
        );

        closeTime.setDate(
            closeTime.getDate() + 1
        );

    }


    return {
        openTime,
        closeTime
    };

}

/* =====================================================
   APPLY OPEN / CLOSE LOCKS
===================================================== */

function applyLocks(game){

    if(
        !openBtn ||
        !closeBtn ||
        !game
    ){

        return;
    }


    /*
       Reset first
    */

    openBtn.disabled = false;

    closeBtn.disabled = false;

    openBtn.classList.remove(
        "locked"
    );

    closeBtn.classList.remove(
        "locked"
    );


    const now =
        new Date();


    const {
        openTime,
        closeTime
    } =
        getGameTimes(game);


    console.log(
        "Game times:",
        {
            now,
            openTime,
            closeTime
        }
    );


    /*
       Open is unavailable after
       open time.
    */

    if(
        now >= openTime
    ){

        openBtn.disabled = true;

        openBtn.classList.add(
            "locked"
        );


        /*
           If open has closed,
           automatically select close.
        */

        if(
            now < closeTime
        ){

            selectClose();

        }

    }


    /*
       Close is unavailable after
       close time.
    */

    if(
        now >= closeTime
    ){

        closeBtn.disabled = true;

        closeBtn.classList.add(
            "locked"
        );

    }


    /*
       Restore selected bet mode
       if still available.
    */

    if(
        bid.betFor === "close" &&
        !closeBtn.disabled
    ){

        closeBtn.classList.add(
            "active"
        );

        openBtn.classList.remove(
            "active"
        );

    }
    else if(
        bid.betFor !== "close" &&
        !openBtn.disabled
    ){

        openBtn.classList.add(
            "active"
        );

        closeBtn.classList.remove(
            "active"
        );

    }


    localStorage.setItem(
        "betInfo",
        JSON.stringify(bid)
    );

}



/* =====================================================
   FETCH CURRENT GAME
===================================================== */

async function fetchGame(){

    if(
        !bid ||
        !bid.gameId
    ){

        return;
    }


    const currentToken =
        getToken();


    if(!currentToken){

        console.log(
            "No login token."
        );

        return;
    }


    try{

        const response =
            await fetch(
                API +
                "/match/gamezone/" +
                bid.gameId,
                {
                    headers:{
                        Authorization:
                            "Bearer " +
                            currentToken
                    }
                }
            );


        if(!response.ok){

            console.log(
                "Game API error:",
                response.status
            );

            return;
        }


        const data =
            await response.json();


        console.log(
            "Current Game:",
            data
        );


        if(
            !data.success ||
            !data.game
        ){

            return;
        }


        /*
           Update game data
        */

        bid.gameName =
            data.game.gameName ||
            bid.gameName;


        bid.openTime =
            data.game.openTime ||
            bid.openTime;


        bid.closeTime =
            data.game.closeTime ||
            bid.closeTime;


        bid.openResult =
            data.game.openResult;


        bid.closeResult =
            data.game.closeResult;


        localStorage.setItem(
            "betInfo",
            JSON.stringify(bid)
        );


        /*
           Update market UI
        */

        const marketName =
            document.getElementById(
                "marketName"
            );


        const marketTitle =
            document.getElementById(
                "marketTitle"
            );


        const marketTime =
            document.getElementById(
                "marketTime"
            );


        if(marketName){

            marketName.innerText =
                bid.gameName;

        }


        if(marketTitle){

            marketTitle.innerText =
                bid.gameName +
                " (" +
                String(
                    bid.betType
                ).toUpperCase() +
                ")";

        }


        if(marketTime){

            marketTime.innerText =
                formatTime12(
                    bid.openTime
                )
                +
                " - "
                +
                formatTime12(
                    bid.closeTime
                );

        }


        showResult(
            bid.openResult,
            bid.closeResult
        );


        applyLocks(

        );


        startCountdown(
            data.game.closeTime
        );

    }
    catch(error){

        );

    }

/* =====================================================
   COUNTDOWN
===================================================== */

function startCountdown(closeTime){

    clearInterval(
        countdownInterval
    );


    const countdown =
        document.getElementById(
            "countdown"
        );


    if(!countdown){

        return;
    }


    if(!closeTime){

        countdown.innerText =
            "--:--:--";

        return;
    }


    let closeDate;


    /*
       ISO
    */

    if(
        String(closeTime).includes("T")
    ){

        closeDate =
            new Date(closeTime);

    }


    /*
       AM / PM
    */

    else if(
        /AM|PM/i.test(
            String(closeTime)
        )
    ){

        closeDate =
            new Date(
                new Date().toDateString()
                +
                " "
                +
                closeTime
            );

    }


    /*
       HH:MM
    */

    else{

        closeDate =
            getTodayTime(
                closeTime
            );

    }


    const now =
        new Date();


    /*
       If today's close time
       has passed, use tomorrow.
    */

    if(
        closeDate <= now
    ){

        closeDate.setDate(
            closeDate.getDate() + 1
        );

    }


    function update(){

        const current =
            new Date();


        const diff =
            closeDate -
            current;


        if(diff <= 0){

            countdown.innerText =
                "Game Closed";


            clearInterval(
                countdownInterval
            );


            return;
        }


        const hours =
            Math.floor(
                diff / 3600000
            );


        const minutes =
            Math.floor(
                (diff % 3600000)
                / 60000
            );


        const seconds =
            Math.floor(
                (diff % 60000)
                / 1000
            );


        countdown.innerText =
            String(hours)
                .padStart(2,"0")
            +
            ":"
            +
            String(minutes)
                .padStart(2,"0")
            +
            ":"
            +
            String(seconds)
                .padStart(2,"0");

    }


    update();


    countdownInterval =
        setInterval(
            update,
            1000
        );

}



/* =====================================================
   PANNA VALIDATION
===================================================== */

function isSinglePanna(num){

    return (
        /^\d{3}$/.test(num)
        &&
        num[0] !== num[1]
        &&
        num[1] !== num[2]
        &&
        num[0] !== num[2]
    );

}


function isDoublePanna(num){

    if(
        !/^\d{3}$/.test(num)
    ){

        return false;
    }


    return (
        (
            num[0] === num[1] &&
            num[1] !== num[2]
        )
        ||
        (
            num[0] === num[2] &&
            num[0] !== num[1]
        )
        ||
        (
            num[1] === num[2] &&
            num[0] !== num[1]
        )
    );

}


function isTriplePanna(num){

    return (
        /^\d{3}$/.test(num)
        &&
        num[0] === num[1]
        &&
        num[1] === num[2]
    );

}



/* =====================================================
   ADD BID
===================================================== */

function addBid(){

    if(!bid){

        alert(
            "Game information missing."
        );

        return;
    }


    const amountValue =
        Number(
            amount.value
        );


    if(
        !amountValue ||
        amountValue < 10
    ){

        alert(
            "Minimum amount is ₹10"
        );

        amount.focus();

        return;
    }


    const type =
        String(
            bid.betType || "single"
        )
        .toLowerCase();


    const newBid = {

        amount:
            amountValue,

        betFor:
            bid.betFor ||
            "open"

    };


    /* =========================
       SINGLE
    ========================= */

    if(type === "single"){

        if(
            !/^\d$/.test(
                digit.value
            )
        ){

            alert(
                "Enter only one digit."
            );

            digit.focus();

            return;
        }


        newBid.number =
            digit.value;

    }


    /* =========================
       JODI
    ========================= */

    else if(type === "jodi"){

        if(
            !/^\d{2}$/.test(
                digit.value
            )
        ){

            alert(
                "Enter two digits."
            );

            digit.focus();

            return;
        }


        newBid.number =
            digit.value;

    }


    /* =========================
       SINGLE PANNA
    ========================= */

    else if(
        type === "singlepanna"
    ){

        if(
            !isSinglePanna(
                digit.value
            )
        ){

            alert(
                "Single Panna must contain 3 different digits."
            );

            digit.focus();

            return;
        }


        newBid.number =
            digit.value;

    }


    /* =========================
       DOUBLE PANNA
    ========================= */

    else if(
        type === "doublepanna"
    ){

        if(
            !isDoublePanna(
                digit.value
            )
        ){

            alert(
                "Double Panna must contain exactly 2 same digits."
            );

            digit.focus();

            return;
        }


        newBid.number =
            digit.value;

    }


    /* =========================
       TRIPLE PANNA
    ========================= */

    else if(
        type === "triplepanna"
    ){

        if(
            !isTriplePanna(
                digit.value
            )
        ){

            alert(
                "Triple Panna must contain all 3 digits same."
            );

            digit.focus();

            return;
        }


        newBid.number =
            digit.value;

    }


    /* =========================
       HALF SANGAM
    ========================= */

    else if(
        type === "halfsangam" ||
        type === "half-sangam"
    ){

        if(
            !/^\d$/.test(
                singleDigit.value
            )
        ){

            alert(
                "Enter Single Digit."
            );

            singleDigit.focus();

            return;
        }


        if(
            !/^\d{3}$/.test(
                halfPanna.value
            )
        ){

            alert(
                "Enter 3 Digit Panna."
            );

            halfPanna.focus();

            return;
        }


        newBid.singleDigit =
            singleDigit.value;


        newBid.panna =
            halfPanna.value;


        newBid.number =
            singleDigit.value +
            " - " +
            halfPanna.value;

    }


    /* =========================
       FULL SANGAM
    ========================= */

    else if(
        type === "fullsangam" ||
        type === "full-sangam"
    ){

        if(
            !/^\d{3}$/.test(
                openPanna.value
            )
        ){

            alert(
                "Enter Open Panna."
            );

            openPanna.focus();

            return;
        }


        if(
            !/^\d{3}$/.test(
                closePanna.value
            )
        ){

            alert(
                "Enter Close Panna."
            );

            closePanna.focus();

            return;
        }


        newBid.openPanna =
            openPanna.value;


        newBid.closePanna =
            closePanna.value;


        newBid.number =
            openPanna.value +
            " - " +
            closePanna.value;

    }


    else{

        alert(
            "Unsupported bet type."
        );

        return;
    }


    bidListData.push(
        newBid
    );


    clearInputs();


    renderBidList();


    console.log(
        "Added Bid:",
        newBid
    );

}

/* =====================================================
   SUBMIT BIDS
===================================================== */

async function submitBids(){

    if(
        bidListData.length === 0
    ){

        alert(
            "Add at least one bid."
        );

        return;
    }


    const currentToken =
        getToken();


    if(!currentToken){

        alert(
            "Please login again."
        );

        window.location.href =
            "auth.html";

        return;
    }


    if(
        !bid ||
        !bid.gameId
    ){

        alert(
            "Game information missing."
        );

        return;
    }


    const submitBtn =
        document.getElementById(
            "submitBtn"
        );


    try{

        if(submitBtn){

            submitBtn.disabled =
                true;

            submitBtn.innerText =
                "Submitting...";
        }


        for(
            const item
            of bidListData
        ){

            const type =
                String(
                    bid.betType
                )
                .toLowerCase();


            const payload = {

                matchId:
                    bid.gameId,

                betType:
                    betTypeMap[type],

                betFor:
                    item.betFor,

                amount:
                    item.amount

            };


            /*
               Full Sangam
            */

            if(
                type === "fullsangam" ||
                type === "full-sangam"
            ){

                payload.number =
                    item.openPanna +
                    "-" +
                    item.closePanna;


                payload.openPanna =
                    item.openPanna;


                payload.closePanna =
                    item.closePanna;

            }


            /*
               Half Sangam
            */

            else if(
                type === "halfsangam" ||
                type === "half-sangam"
            ){

                payload.number =
                    item.singleDigit +
                    "-" +
                    item.panna;


                payload.singleDigit =
                    item.singleDigit;


                payload.panna =
                    item.panna;

            }


            /*
               Normal
            */

            else{

                payload.number =
                    item.number;

            }


            console.log(
                "Submitting:",
                payload
            );


            const response =
                await fetch(
                    API +
                    "/admin/bet/place",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json",

                            Authorization:
                                "Bearer " +
                                currentToken
                        },

                        body:
                            JSON.stringify(
                                payload
                            )
                    }
                );


            let data = {};


            try{

                data =
                    await response.json();

            }
            catch{

                data = {};

            }


            if(!response.ok){

                alert(
                    data.msg ||
                    data.message ||
                    "Bet failed."
                );

                return;
            }

        }


        alert(
            "🎉 Bet placed successfully!"
        );


        bidListData = [];


        renderBidList();


        clearInputs();


        await loadBalance();

    }
    catch(error){

        console.error(
            "Submit Bet Error:",
            error
        );


        alert(
            "Server error. Please try again."
        );

    }
    finally{

        if(submitBtn){

            submitBtn.disabled =
                false;

            submitBtn.innerText =
                "Submit";

        }

    }

}

        );

    localStorage.setItem(
        "betInfo",
        JSON.stringify(bid)
    );


    await loadBalance();


    await fetchGame();


    /*
       Refresh balance every 30 sec.
    */

    setInterval(
        loadBalance,
        30000
    );


    /*
       Refresh game every 30 sec.
    */

    gameRefreshInterval =
        setInterval(
            fetchGame,
            30000
        );

}


initializePage();

</script>
