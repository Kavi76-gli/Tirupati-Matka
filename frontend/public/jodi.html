<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> Tirupati Matka</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/jodi.css">
  <link rel="stylesheet" href="global.css">
</head>
<body>

<!-- ================= HEADER ================= -->
<div class="header">
  <div class="logo">
    <img src="ka.jpeg" alt="Kalyan Master Logo">
  </div>

  <div class="header-icons">
    <i class="fa-solid fa-bell" onclick="goPage('notification.html')"></i>

    <div class="balance" id="balance">₹0.00</div>

    <i class="fa-solid fa-bars" onclick="toggleMenu()"></i>
  </div>
</div>

<!-- ================= MARKET CARD ================= -->
<div class="card">
  <h2>MAIN BAZAR</h2>
  <p class="subtitle">Jodi</p>
</div>
<!-- DIGIT FILTER -->
<div class="digits">
  <button onclick="filterDigit('1')">1</button>
  <button onclick="filterDigit('2')">2</button>
  <button onclick="filterDigit('3')">3</button>
  <button onclick="filterDigit('4')">4</button>
  <button onclick="filterDigit('5')">5</button>
  <button onclick="filterDigit('6')">6</button>
  <button onclick="filterDigit('7')">7</button>
  <button onclick="filterDigit('8')">8</button>
  <button onclick="filterDigit('9')">9</button>
  <button onclick="filterDigit('0')">0</button>
  <button onclick="resetFilter()">All</button>
</div>

<!-- SEARCH -->
<div class="search-box">
  <input id="searchInput" placeholder="Search jodi (e.g. 37 or 3)">
  <button onclick="searchJodi()">Search</button>
</div>

<!-- ================= JODI GRID ================= -->
<div class="grid" id="jodiGrid">
  <!-- Jodi cards auto-generated by jodi.js -->
</div>

<!-- ================= SUBMIT BUTTON ================= -->
<button class="confirmBid" onclick="submitBids()">
  View Bid Details
</button>

<!-- ================= SIDE MENU ================= -->
<div class="side-menu" id="sideMenu">
  <div class="menu-header">
    <h3>Menu</h3>
    <button class="close-btn" onclick="toggleMenu()">×</button>
  </div>

  <ul class="menu-list">
    <li onclick="go('profile.html')">Profile</li>
    <li onclick="go('add-fund.html')">Deposit</li>
    <li onclick="go('withdraw.html')">Withdraw</li>
    <li onclick="go('transition.html')">Transactions</li>
    <li onclick="go('gamezone.html')">Game Zone</li>
     <li onclick="go('reer.html')">Refer & Earn</li>
    <li onclick="go('history.html')">History</li>
    <li onclick="go('ratio.html')">Ratios</li>
    <li onclick="go('logout.html')">Logout</li>
  </ul>
</div>

<!-- ================= BOTTOM NAV ================= -->
<div class="bottom-nav">
  <div class="nav-item" onclick="goPage('reer.html')">
    <i class="fa-solid fa-user"></i>
    <span>Refer</span>
  </div>

  <div class="nav-item" onclick="goPage('history.html')">
    <i class="fa-solid fa-clock"></i>
    <span>History</span>
  </div>

  <div class="nav-item center" onclick="goPage('gamezone.html')">
    <i class="fa-solid fa-house"></i>
    <span>Home</span>
  </div>

  <div class="nav-item" onclick="goPage('bid.html')">
    <i class="fa-solid fa-gavel"></i>
    <span>Bid</span>
  </div>

  <div class="nav-item" onclick="goPage('wallet.html')">
    <i class="fa-solid fa-wallet"></i>
    <span>Wallet</span>
  </div>
</div>

<!-- ================= SCRIPTS ================= -->
<script src="js/jodi.js"></script>
<script src="nav.js"></script>
</body>

</html>
