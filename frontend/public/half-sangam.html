<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Half Sangam</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="global.css">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",sans-serif;
}

body{
  background:radial-gradient(circle at top,#081a33,#020b18);
  color:#e6f1ff;
  padding-bottom:90px;
}

/* ================= HEADER ================= */
/* HEADER */
.header {
  height: 76px;
  background: linear-gradient(180deg, #000000, #050505);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  border-bottom: 1px solid rgba(212,175,55,0.45);
}

/* LOGO AREA */
.logo {
  display: flex;
  align-items: center;
}

/* LOGO IMAGE – CLEAR & PREMIUM */
.logo img {
  height: 64px;          /* 🔥 bigger = clarity */
  width: auto;
  object-fit: contain;
  filter: 
    contrast(1.25)
    brightness(1.15);
}


/* RIGHT ICONS */
.header-icons {
  display: flex;
  align-items: center;
  gap: 14px;
}

/* ICON STYLE */
.header-icons i {
  font-size: 20px;
  color: #d4af37;             /* gold tone */
  cursor: pointer;
}

/* BALANCE */
.balance {
  background: linear-gradient(135deg, #b8962e, #f3da8c);
  color: #2b1a00;
  padding: 6px 14px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 700;
}
/* ================= MARKET CARD ================= */
.market-card{
  margin:14px;
  padding:14px;
  background:#021126;
  border-radius:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 0 12px #00eaff33;
}

.market-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.market-icon{
  width:48px;
  height:48px;
  border-radius:14px;
  background:linear-gradient(135deg,#0d47ff,#00eaff);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
  font-weight:bold;
}

.market-info h3{
  font-size:16px;
}

.market-info span{
  font-size:13px;
  color:#9fdfff;
}

/* ================= GAME TYPE ================= */
.game-type{
  margin:10px 14px;
  padding:14px;
  background:#021b36;
  border-radius:16px;
  display:flex;
  align-items:center;
  gap:14px;
}

.game-icon-big{
  width:55px;
  height:55px;
  border-radius:16px;
  background:linear-gradient(135deg,#00bfff,#0d47ff);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:26px;
  font-weight:bold;
}

.game-type strong{
  font-size:18px;
}

/* ================= FORM CARDS ================= */
.form-card{
  margin:14px;
  padding:14px;
  background:#021126;
  border-radius:16px;
  box-shadow:0 0 10px #00eaff22;
}

.form-card label{
  font-size:14px;
  color:#9fdfff;
  margin-bottom:6px;
  display:block;
}

.form-card input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #00eaff44;
  background:#000c1f;
  color:#00eaff;
  font-size:16px;
  outline:none;
}

.form-card input::placeholder{
  color:#6fa9cc;
}

/* ================= SUBMIT ================= */
.submit-box{
  margin:20px 14px;
}

.submit-box button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:30px;
  font-size:18px;
  font-weight:bold;
  background:linear-gradient(90deg,#00bfff,#0d47ff);
  color:#fff;
  cursor:pointer;
  box-shadow:0 0 18px #00eaff66;
}

/* ================= SIDE MENU ================= */
.side-menu{
  position:fixed;
  top:0;
  right:-260px;
  width:260px;
  height:100%;
  background:#021126;
  transition:.3s;
  z-index:999;
}

.side-menu.active{right:0}

.menu-header{
  padding:16px;
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #00eaff33;
}

.menu-list{
  list-style:none;
}

.menu-list li{
  padding:14px 16px;
  border-bottom:1px solid #00eaff22;
  cursor:pointer;
}

/* ================= BOTTOM NAV ================= */
.bottom-nav{
  position:fixed;
  bottom:0;
  width:100%;
  height:70px;
  background:#021126;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid #00eaff33;
}

.nav-item{
  text-align:center;
  font-size:12px;
  color:#9fdfff;
}

.nav-item i{
  font-size:18px;
  display:block;
  margin-bottom:4px;
}

.nav-item.center{
  background:linear-gradient(135deg,#00bfff,#0d47ff);
  padding:12px 18px;
  border-radius:20px;
  color:#fff;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">
    <img src="ka.jpeg" alt="Kalyan Master Logo">
  </div>

  <div class="header-icons">
    <i class="fa-solid fa-bell" onclick="goPage('notification.html')"></i>

    <div class="balance" id="balance">₹0.00</div>

    <i class="fa-solid fa-bars" onclick="toggleMenu()"></i>
  </div>
</div>

<!-- MARKET -->
<div class="market-card">
  <div class="market-left">
    <div class="market-icon">H</div>
    <div class="market-info">
      <h3 id="marketName">---</h3>
      <span>Half Sangam</span>
    </div>
  </div>
</div>

<!-- GAME TYPE -->
<div class="game-type">
  <div class="game-icon-big">H</div>
  <strong>HALF SANGAM</strong>
</div>

<!-- OPEN PANNA -->
<div class="form-card" id="openPannaBox">
  <label>Open Panna (000-999)</label>
  <input type="number" id="openPanna" placeholder="Enter Open Panna" max="999" min="0" oninput="this.value = this.value.slice(0,3)">
</div>

<!-- OPEN DIGIT -->
<div class="form-card" id="openDigitBox">
  <label>Open Digit (0-9)</label>
  <input type="number" id="openDigit" placeholder="Enter Open Digit" max="9" min="0" oninput="this.value = this.value.slice(0,1)">
</div>

<!-- CLOSE DIGIT -->
<div class="form-card" id="closeDigitBox">
  <label>Close Digit (0-9)</label>
  <input type="number" id="closeDigit" placeholder="Enter Close Digit" max="9" min="0" oninput="this.value = this.value.slice(0,1)">
</div>

<!-- CLOSE PANNA -->
<div class="form-card" id="closePannaBox">
  <label>Close Panna (000-999)</label>
  <input type="number" id="closePanna" placeholder="Enter Close Panna" max="999" min="0" oninput="this.value = this.value.slice(0,3)">
</div>

<!-- AMOUNT -->
<div class="form-card">
  <label>Amount</label>
  <input type="number" id="amount" placeholder="Minimum ₹10" min="10">
</div>

<!-- SUBMIT -->
<div class="submit-box">
  <button onclick="submitHalfSangam()">Submit Bid</button>
</div>


<!-- SIDE MENU -->
<div class="side-menu" id="sideMenu">
  <div class="menu-header">
    <h3>Menu</h3>
    <button onclick="toggleMenu()">×</button>
  </div>
  <ul class="menu-list">
    <li onclick="go('profile.html')">Profile</li>
    <li onclick="go('add-fund.html')">Deposit</li>
    <li onclick="go('withdraw.html')">Withdraw</li>
    <li onclick="go('transition.html')">Transactions</li>
    <li onclick="go('gamezone.html')">Game Zone</li>
     <li onclick="go('reer.html')">Refer & Earn</li>
    <li onclick="go('history.html')">History</li>
    <li onclick="go('ratio.html')">Ratios</li>
    <li onclick="go('logout.html')">Logout</li>
  </ul>
</div>

<!-- BOTTOM NAV -->

<div class="bottom-nav">
  <div class="nav-item" data-page="reer.html">
    <i class="fa-solid fa-user"></i>
    <span>Refer</span>
  </div>

  <div class="nav-item" data-page="history.html">
    <i class="fa-solid fa-clock"></i>
    <span>Bid History</span>
  </div>

  <div class="nav-item center" data-page="gamezone.html">
    <i class="fa-solid fa-house"></i>
    <span>Home</span>
  </div>

  <div class="nav-item" data-page="my-transition.html">
    <i class="fa-solid fa-gavel"></i>
    <span>Transaction</span>
  </div>

  <div class="nav-item" data-page="wallet.html">
    <i class="fa-solid fa-wallet"></i>
    <span>Wallet</span>
  </div>

  <div class="active-indicator"></div>
</div>

<script>
/* ======================================================
   CONFIG
====================================================== */
const API = "https://kalyanmaster.onrender.com/api/auth";
const token = localStorage.getItem("token");

/* ======================================================
   LOAD BALANCE
====================================================== */
async function loadBalance() {
  try {
    const res = await fetch(API + "/balance", {
      headers: { Authorization: "Bearer " + token }
    });
    const data = await res.json();

    const balanceEl = document.getElementById("balance");
    if (data.success && balanceEl) {
      balanceEl.innerText = "₹" + data.balance;
    }
  } catch (e) {
    console.error("Balance error:", e);
  }
}
loadBalance();

/* ======================================================
   LOAD BET INFO
====================================================== */
let bet = null;
try {
  bet = JSON.parse(localStorage.getItem("betInfo"));
} catch {
  bet = null;
}

if (!bet || !bet.gameId) {
  alert("No game selected");
  location.href = "play.html";
}

/* ======================================================
   BASIC UI SETUP
====================================================== */
const marketNameEl = document.getElementById("marketName");
if (marketNameEl) {
  marketNameEl.innerText = bet.gameName;
}

/* ======================================================
   INPUT BOX REFERENCES
====================================================== */
const openPannaBox  = document.getElementById("openPannaBox");
const openDigitBox  = document.getElementById("openDigitBox");
const closeDigitBox = document.getElementById("closeDigitBox");
const closePannaBox = document.getElementById("closePannaBox");

/* ======================================================
   AUTO SHOW FIELDS
====================================================== */
function setupHalfSangamUI() {
  openPannaBox.style.display  = "none";
  openDigitBox.style.display  = "none";
  closeDigitBox.style.display = "none";
  closePannaBox.style.display = "none";

  if (bet.betFor === "open") {
    openDigitBox.style.display  = "block";
    closePannaBox.style.display = "block";
  }

  if (bet.betFor === "close") {
    openPannaBox.style.display  = "block";
    closeDigitBox.style.display = "block";
  }
}
setupHalfSangamUI();

/* ======================================================
   VALIDATION HELPERS
====================================================== */
function isValidDigit(v) {
  return v !== "" && v >= 0 && v <= 9;
}

function isValidPanna(v) {
  return v !== "" && v >= 0 && v <= 999;
}

/* ======================================================
   SUBMIT HALF SANGAM (SINGLE VERSION)
====================================================== */
function submitHalfSangam() {
  const amount = Number(document.getElementById("amount").value);

  if (amount < 10) {
    return alert("Minimum amount ₹10");
  }

  let number = "";

  if (bet.betFor === "open") {
    const openDigit  = document.getElementById("openDigit").value;
    const closePanna = document.getElementById("closePanna").value;

    if (!isValidDigit(openDigit) || !isValidPanna(closePanna)) {
      return alert("Enter valid Open Digit and Close Panna");
    }

    number = `${openDigit}-${closePanna}`;
  }

  if (bet.betFor === "close") {
    const openPanna  = document.getElementById("openPanna").value;
    const closeDigit = document.getElementById("closeDigit").value;

    if (!isValidPanna(openPanna) || !isValidDigit(closeDigit)) {
      return alert("Enter valid Open Panna and Close Digit");
    }

    number = `${openPanna}-${closeDigit}`;
  }

  const pendingBet = {
    matchId: bet.gameId,
    gameName: bet.gameName,
    betType: "halfsangam",
    betFor: bet.betFor,
    bids: [{ number, amount }],
    totalAmount: amount
  };

  localStorage.setItem("pendingBet", JSON.stringify(pendingBet));
  location.href = "bid-details.html";
}

/* ======================================================
   COMMON UI
====================================================== */
function go(page) {
  location.href = page;
}
function toggleMenu() {
  document.getElementById("sideMenu").classList.toggle("active");
}
</script>


<script src="nav.js"></script>
</body>
</html>
