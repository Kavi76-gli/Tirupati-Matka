<!-- =====================================================
     FONT AWESOME

<link

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(22,163,74,.10),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            #ffffff 0%,
            #f8fbf9 55%,
            #eef6f1 100%
        );

    color:#17231c;

    padding-bottom:105px;

    overflow-x:hidden;
}


/* =========================================================
   HEADER
========================================================= */

.header{

    position:sticky;

    top:0;

    z-index:1000;

    height:68px;

    padding:0 15px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:rgba(255,255,255,.95);

    backdrop-filter:blur(18px);

    border-bottom:1px solid #e4eee7;

    box-shadow:
        0 6px 25px rgba(20,80,40,.07);
}


.logo{

    display:flex;

    align-items:center;

    gap:10px;

    min-width:0;
}


.logo img{

    width:40px;

    height:40px;

    object-fit:cover;

    border-radius:12px;

    border:1px solid #dceee2;

    box-shadow:
        0 7px 18px rgba(22,163,74,.12);
}


.logo-text{

    display:flex;

    flex-direction:column;

    line-height:1.2;

}


.logo-text strong{

    font-size:14px;

    font-weight:800;

    color:#17231c;
}


.logo-text span{

    font-size:9px;

    color:#16a34a;

    font-weight:700;

    letter-spacing:.8px;
}


/* =========================================================
   HEADER RIGHT
========================================================= */

.header-right{

    display:flex;

    align-items:center;

    gap:8px;
}


.balance{

    display:flex;

    align-items:center;

    gap:6px;

    padding:9px 11px;

    border-radius:14px;

    background:#f0fdf4;

    border:1px solid #d5eddb;

    color:#15803d;

    font-size:11px;

    font-weight:800;

    white-space:nowrap;
}


.balance i{

    font-size:12px;
}


.back-btn{

    width:40px;

    height:40px;

    border:none;

    border-radius:13px;

    background:#fff;

    border:1px solid #e2ece5;

    color:#15803d;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    box-shadow:
        0 7px 18px rgba(20,80,40,.06);

    transition:.2s;
}


.back-btn:active{

    transform:scale(.91);
}


/* =========================================================
   MAIN WRAPPER
========================================================= */

.wrap{

    width:min(600px,100%);

    margin:auto;

    padding:18px 14px 25px;
}


/* =========================================================
   PAGE TITLE
========================================================= */

.page-title{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:15px;
}


.page-title h1{

    font-size:20px;

    font-weight:800;

    color:#17231c;
}


.page-title h1 span{

    color:#16a34a;
}


.page-title p{

    font-size:10px;

    color:#8a968f;

    margin-top:3px;
}


.refresh-btn{

    width:40px;

    height:40px;

    border:none;

    border-radius:13px;

    background:#f0fdf4;

    color:#15803d;

    border:1px solid #d7eddd;

    cursor:pointer;

    transition:.25s;
}


.refresh-btn:active{

    transform:scale(.91);
}


.refresh-btn.loading i{

    animation:spin .8s linear infinite;
}


/* =========================================================
   SUMMARY CARD
========================================================= */

.summary-card{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:10px;

    margin-bottom:15px;
}


.summary-box{

    background:#fff;

    border:1px solid #e3eee7;

    border-radius:18px;

    padding:14px;

    box-shadow:
        0 9px 25px rgba(20,80,40,.05);
}


.summary-icon{

    width:32px;

    height:32px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:10px;

    background:#f0fdf4;

    color:#16a34a;

    font-size:13px;

    margin-bottom:9px;
}


.summary-box strong{

    display:block;

    font-size:17px;

    font-weight:800;

    color:#17231c;
}


.summary-box span{

    display:block;

    margin-top:2px;

    color:#8a968f;

    font-size:9px;

    font-weight:600;
}


/* =========================================================
   BET CARD
========================================================= */

.bet-card{

    position:relative;

    overflow:hidden;

    background:#fff;

    border:1px solid #e1ece5;

    border-radius:20px;

    padding:16px;

    margin-bottom:12px;

    box-shadow:
        0 10px 28px rgba(20,80,40,.055);

    animation:
        cardIn .45s ease both;

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}


.bet-card::before{

    content:"";

    position:absolute;

    left:0;

    top:0;

    width:4px;

    height:100%;

    background:#22c55e;

    border-radius:10px;
}


.bet-card:hover{

    transform:translateY(-2px);

    box-shadow:
        0 15px 32px rgba(20,80,40,.09);
}


/* =========================================================
   CARD TOP
========================================================= */

.card-top{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:12px;

    padding-left:4px;
}


.market-info{

    min-width:0;
}


.title{

    color:#17231c;

    font-size:14px;

    font-weight:800;

    line-height:1.4;
}


.small{

    color:#7b8880;

    font-size:10px;

    margin-top:5px;

    line-height:1.5;
}


.small b{

    color:#34423a;
}


/* =========================================================
   STATUS BADGE
========================================================= */

.badge{

    flex-shrink:0;

    display:flex;

    align-items:center;

    gap:5px;

    padding:7px 9px;

    border-radius:999px;

    font-size:9px;

    font-weight:800;

    background:#fff8e8;

    color:#b7791f;

    border:1px solid #f5dfad;
}


.badge.won{

    background:#f0fdf4;

    color:#15803d;

    border-color:#cdebd5;
}


.badge.lost{

    background:#fff5f5;

    color:#dc2626;

    border-color:#f2d0d0;
}


/* =========================================================
   CARD DETAILS
========================================================= */

.bet-details{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:8px;

    margin-top:14px;

    padding-top:13px;

    border-top:1px solid #edf2ee;
}


.detail-box{

    background:#f8faf8;

    border:1px solid #edf2ee;

    border-radius:12px;

    padding:9px;

    text-align:center;
}


.detail-box span{

    display:block;

    font-size:8px;

    color:#8a968f;

    font-weight:600;

    margin-bottom:3px;
}


.detail-box strong{

    display:block;

    font-size:11px;

    color:#26342c;

    font-weight:800;

    word-break:break-word;
}


.detail-box.amount strong{

    color:#15803d;
}


/* =========================================================
   DATE
========================================================= */

.bet-date{

    display:flex;

    align-items:center;

    gap:6px;

    margin-top:11px;

    padding-left:4px;

    color:#99a39d;

    font-size:9px;
}


.bet-date i{

    color:#16a34a;

    font-size:10px;
}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty{

    min-height:270px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:30px 15px;

    background:#fff;

    border:1px solid #e4eee7;

    border-radius:22px;

    box-shadow:
        0 10px 30px rgba(20,80,40,.05);
}


.empty-icon{

    width:70px;

    height:70px;

    border-radius:22px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#f0fdf4;

    color:#16a34a;

    font-size:28px;

    margin-bottom:15px;
}


.empty h3{

    font-size:16px;

    color:#26342c;

    margin-bottom:5px;
}


.empty p{

    max-width:280px;

    color:#89948e;

    font-size:10px;

    line-height:1.6;
}


/* =========================================================
   LOADING
========================================================= */

.loading-box{

    min-height:270px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    background:#fff;

    border:1px solid #e4eee7;

    border-radius:22px;

    box-shadow:
        0 10px 30px rgba(20,80,40,.05);
}


.spinner{

    width:42px;

    height:42px;

    border-radius:50%;

    border:3px solid #e1eee5;

    border-top-color:#16a34a;

    animation:
        spin .8s linear infinite;

    margin-bottom:12px;
}


.loading-box span{

    color:#89948e;

    font-size:11px;

    font-weight:600;
}


/* =========================================================
   ERROR
========================================================= */

.error-box{

    min-height:230px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    background:#fff;

    border:1px solid #f0dddd;

    border-radius:22px;

    padding:25px;
}


.error-box i{

    font-size:34px;

    color:#dc2626;

    margin-bottom:12px;
}


.error-box strong{

    color:#343d37;

    font-size:14px;
}


.error-box p{

    color:#8c9690;

    font-size:10px;

    margin:5px 0 14px;
}


.retry-btn{

    border:none;

    padding:10px 18px;

    border-radius:12px;

    background:#16a34a;

    color:#fff;

    font-size:10px;

    font-weight:700;

    cursor:pointer;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{

    position:fixed;

    left:50%;

    bottom:10px;

    transform:translateX(-50%);

    width:min(500px,calc(100% - 20px));

    height:70px;

    padding:7px;

    display:grid;

    grid-template-columns:repeat(5,1fr);

    background:rgba(255,255,255,.96);

    backdrop-filter:blur(18px);

    border:1px solid #e0ebe4;

    border-radius:23px;

    box-shadow:
        0 15px 40px rgba(20,80,40,.13);

    z-index:1500;
}


.nav-item{

    border:none;

    background:transparent;

    border-radius:17px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:4px;

    color:#8a968f;

    font-size:8px;

    font-weight:600;

    cursor:pointer;

    transition:.2s;
}


.nav-item i{

    font-size:16px;
}


.nav-item.active{

    background:#f0fdf4;

    color:#15803d;
}


.nav-item:active{

    transform:scale(.92);
}


/* =========================================================
   TOAST
========================================================= */

.toast{

    position:fixed;

    left:50%;

    bottom:94px;

    transform:
        translate(-50%,20px)
        scale(.95);

    max-width:calc(100% - 30px);

    width:max-content;

    padding:11px 15px;

    border-radius:13px;

    background:#17231c;

    color:#fff;

    font-size:10px;

    font-weight:600;

    opacity:0;

    visibility:hidden;

    z-index:4000;

    transition:.3s;
}


.toast.show{

    opacity:1;

    visibility:visible;

    transform:
        translate(-50%,0)
        scale(1);
}


/* =========================================================
   MAGNETIC
========================================================= */

.magnetic{

    will-change:transform;
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


@keyframes cardIn{

    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:380px){

    .header{
        padding:0 10px;
    }

    .logo-text strong{
        font-size:12px;
    }

    .balance{
        padding:8px 8px;
        font-size:10px;
    }

    .back-btn{
        width:37px;
        height:37px;
    }

    .wrap{
        padding-left:10px;
        padding-right:10px;
    }

    .page-title h1{
        font-size:18px;
    }

    .bet-details{
        grid-template-columns:1fr 1fr;
    }

    .detail-box:last-child{
        grid-column:span 2;
    }

}

</style>
</head>


<body>

<!-- =====================================================
     TOAST
===================================================== -->

<div
    class="toast"
    id="toast"
></div>


<script>

/* =========================================================
   API CONFIGURATION
========================================================= */

const API_AUTH =
    "https://tirupati-matka.onrender.com/api/auth";

const API =
    "https://tirupati-matka.onrender.com/api/gali-bet/my";


/* =========================================================
   TOKEN
========================================================= */

function getToken(){

    return (
        localStorage.getItem("token") ||
        localStorage.getItem("ki_token") ||
        ""
    );

}


/* =========================================================
   ELEMENTS
========================================================= */

const balanceElement =
    document.getElementById("balance");

const betList =
    document.getElementById("betList");

const totalBets =
    document.getElementById("totalBets");

const totalAmount =
    document.getElementById("totalAmount");

const refreshBtn =
    document.getElementById("refreshBtn");

const backBtn =
    document.getElementById("backBtn");


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.innerText =
        message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(
            ()=>{
                toast.classList.remove("show");
            },
            2200
        );

}


/* =========================================================
   FORMAT MONEY
========================================================= */

function formatMoney(value){

    const amount =
        Number(value) || 0;

    return amount.toLocaleString(
        "en-IN",
        {
            minimumFractionDigits:0,
            maximumFractionDigits:2
        }
    );

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(dateStr){

    if(!dateStr){
        return "Date unavailable";
    }

    const date =
        new Date(dateStr);

    if(Number.isNaN(date.getTime())){
        return "Date unavailable";
    }

    return date.toLocaleString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   LOAD BALANCE
========================================================= */

async function loadBalance(){

    const token =
        getToken();

    if(!token){

        balanceElement.innerText =
            "₹0";

        return;

    }


    try{

        const response =
            await fetch(
                `${API_AUTH}/balance`,
                {
                    method:"GET",

                    headers:{
                        Authorization:
                            `Bearer ${token}`
                    },

                    cache:"no-store"
                }
            );


        const data =
            await response.json();


        console.log(
            "Balance response:",
            data
        );


        if(response.status === 401){

            handleSessionExpired();

            return;

        }


        if(
            response.ok &&
            data.success
        ){

            const balance =
                Math.floor(
                    Number(
                        data.balance ??
                        data.user?.balance ??
                        data.user?.wallet ??
                        0
                    )
                );


            balanceElement.innerText =
                `₹${formatMoney(balance)}`;

        }

    }
    catch(error){

        console.error(
            "BALANCE ERROR:",
            error
        );

    }

}


/* =========================================================
   SESSION EXPIRED
========================================================= */

function handleSessionExpired(){

    localStorage.removeItem("token");

    localStorage.removeItem("ki_token");

    localStorage.removeItem("user");

    showToast(
        "Session expired. Please login again."
    );


    setTimeout(
        ()=>{
            window.location.href =
                "auth.html";
        },
        1000
    );

}


/* =========================================================
   STATUS
========================================================= */

function getStatus(bet){

    const status =
        String(
            bet.resultStatus ||
            bet.status ||
            "pending"
        )
        .toLowerCase()
        .trim();


    if(status === "won"){
        return {
            text:"WON",
            className:"won",
            icon:"fa-trophy"
        };
    }


    if(status === "lost"){
        return {
            text:"LOST",
            className:"lost",
            icon:"fa-circle-xmark"
        };
    }


    return {
        text:"PENDING",
        className:"",
        icon:"fa-clock"
    };

}


/* =========================================================
   LOAD MY BETS
========================================================= */

async function loadMyBets(){

    const token =
        getToken();


    if(!token){

        betList.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    <i class="fa-solid fa-lock"></i>
                </div>

                <h3>
                    Login Required
                </h3>

                <p>
                    Please login to view your Gali bets.
                </p>

            </div>

        `;

        return;

    }


    betList.innerHTML = `

        <div class="loading-box">

            <div class="spinner"></div>

            <span>
                Loading your bets...
            </span>

        </div>

    `;


    try{

        const response =
            await fetch(
                API,
                {
                    method:"GET",

                    headers:{
                        Authorization:
                            `Bearer ${token}`
                    },

                    cache:"no-store"
                }
            );


        const data =
            await response.json();


        console.log(
            "My Gali Bets response:",
            data
        );


        if(response.status === 401){

            handleSessionExpired();

            return;

        }


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.msg ||
                "Unable to load bets"
            );

        }


        const bets =
            Array.isArray(data.bets)
                ? data.bets
                : [];


        /* -------------------------------------------------
           SUMMARY
        ------------------------------------------------- */

        totalBets.innerText =
            bets.length;


        const total =
            bets.reduce(
                (
                    sum,
                    bet
                ) =>
                    sum +
                    (
                        Number(
                            bet.amount
                        ) || 0
                    ),
                0
            );


        totalAmount.innerText =
            `₹${formatMoney(total)}`;


        /* -------------------------------------------------
           EMPTY
        ------------------------------------------------- */

        if(!bets.length){

            betList.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        <i class="fa-solid fa-ticket"></i>
                    </div>

                    <h3>
                        No Gali Bets Yet
                    </h3>

                    <p>
                        Your placed Gali bets will appear here.
                    </p>

                </div>

            `;

            return;

        }


        /* -------------------------------------------------
           RENDER
        ------------------------------------------------- */

        betList.innerHTML =
            bets
            .map(
                (
                    bet,
                    index
                ) => {

                    const status =
                        getStatus(bet);


                    const gameName =
                        escapeHtml(
                            bet.match?.gameName ||
                            bet.gameName ||
                            "Gali"
                        );


                    const betType =
                        escapeHtml(
                            String(
                                bet.betType ||
                                ""
                            ).toUpperCase()
                        );


                    const betFor =
                        escapeHtml(
                            String(
                                bet.betFor ||
                                "-"
                            ).toUpperCase()
                        );


                    const number =
                        escapeHtml(
                            bet.number ??
                            "-"
                        );


                    const amount =
                        Number(
                            bet.amount
                        ) || 0;


                    return `

                        <article
                            class="bet-card"
                            style="animation-delay:${Math.min(index * 45,500)}ms"
                        >

                            <div class="card-top">

                                <div class="market-info">

                                    <div class="title">

                                        ${gameName}

                                        <span style="color:#16a34a;">
                                            •
                                        </span>

                                        ${betType}

                                    </div>


                                    <div class="small">

                                        ${betFor}

                                        • Number:

                                        <b>
                                            ${number}
                                        </b>

                                    </div>

                                </div>


                                <div
                                    class="badge ${status.className}"
                                >

                                    <i
                                        class="fa-solid ${status.icon}"
                                    ></i>

                                    ${status.text}

                                </div>

                            </div>


                            <div class="bet-details">

                                <div class="detail-box">

                                    <span>
                                        BET TYPE
                                    </span>

                                    <strong>
                                        ${betType || "-"}
                                    </strong>

                                </div>


                                <div class="detail-box">

                                    <span>
                                        NUMBER
                                    </span>

                                    <strong>
                                        ${number}
                                    </strong>

                                </div>


                                <div class="detail-box amount">

                                    <span>
                                        AMOUNT
                                    </span>

                                    <strong>
                                        ₹${formatMoney(amount)}
                                    </strong>

                                </div>

                            </div>


                            <div class="bet-date">

                                <i
                                    class="fa-regular fa-calendar"
                                ></i>

                                ${escapeHtml(
                                    formatDate(
                                        bet.createdAt
                                    )
                                )}

                            </div>

                        </article>

                    `;

                }
            )
            .join("");

    }
    catch(error){

        console.error(
            "MY GALI BETS ERROR:",
            error
        );


        totalBets.innerText =
            "0";

        totalAmount.innerText =
            "₹0";


        betList.innerHTML = `

            <div class="error-box">

                <i class="fa-solid fa-triangle-exclamation"></i>

                <strong>
                    Unable to load your bets
                </strong>

                <p>
                    Please check your connection and try again.
                </p>

                <button
                    class="retry-btn"
                    id="retryBtn"
                >
                    Try Again
                </button>

            </div>

        `;


        document
            .getElementById("retryBtn")
            ?.addEventListener(
                "click",
                loadMyBets
            );

    }

}


/* =========================================================
   REFRESH
========================================================= */

async function refreshData(){

    refreshBtn.classList.add(
        "loading"
    );

    await Promise.all([
        loadBalance(),
        loadMyBets()
    ]);

    refreshBtn.classList.remove(
        "loading"
    );

    showToast(
        "Bet history refreshed"
    );

}


/* =========================================================
   BACK
========================================================= */

backBtn.addEventListener(
    "click",
    ()=>{
        history.back();
    }
);


/* =========================================================
   BOTTOM NAVIGATION
========================================================= */

document
    .querySelectorAll(
        ".nav-item[data-page]"
    )
    .forEach(
        item => {

            item.addEventListener(
                "click",
                ()=>{
                    const page =
                        item.dataset.page;

                    if(page){
                        window.location.href =
                            page;
                    }
                }
            );

        }
    );


/* =========================================================
   MAGNETIC EFFECT
========================================================= */

function enableMagnetic(){

    if(
        !window.matchMedia(
            "(pointer:fine)"
        ).matches
    ){

        return;

    }


    document
        .querySelectorAll(
            ".magnetic"
        )
        .forEach(
            element => {

                element.addEventListener(
                    "mousemove",
                    event => {

                        const rect =
                            element.getBoundingClientRect();


                        const x =
                            event.clientX -
                            rect.left -
                            rect.width / 2;


                        const y =
                            event.clientY -
                            rect.top -
                            rect.height / 2;


                        element.style.transform =
                            `translate(${x * .15}px,${y * .15}px)`;

                    }
                );


                element.addEventListener(
                    "mouseleave",
                    ()=>{
                        element.style.transform =
                            "";
                    }
                );

            }
        );

}


/* =========================================================
   REFRESH BUTTON
========================================================= */

refreshBtn.addEventListener(
    "click",
    refreshData
);


/* =========================================================
   INITIAL LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    ()=>{
        enableMagnetic();

        loadBalance();

        loadMyBets();
    }
);

</script>
