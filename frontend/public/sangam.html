<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Half Sangam - Close Digit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/sangam0.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="global.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">
    <img src="https://i.imgur.com/8Km9tLL.png" />
    <span>Kalyan Satka <b>Matka</b></span>
  </div>

  <div class="actions">
    <i class="fa-regular fa-bell"></i>
    <div class="balance">
      <i class="fa-solid fa-wallet"></i> ₹0.00
    </div>
    <i class="fa-solid fa-bars"></i>
  </div>
</header>

<!-- MAIN -->
<main class="page">

  <!-- MARKET -->
  <div class="card market">
    <div class="left">
      <div class="icon">K</div>
      <div>
        <h3>MAIN BAZAR</h3>
        <p>Half Sangam</p>
      </div>
    </div>
    <i class="fa-solid fa-spade"></i>
  </div>

  <!-- CLOSE DIGIT -->
  <div class="card">
    <label>Close Digit</label>
    <small>Enter single digit (0-9)</small>
    <input type="number" maxlength="1" placeholder="Enter Digit (1 digit)" />
  </div>

  <!-- OPEN PANNA -->
  <div class="card">
    <label>Open Panna</label>
    <small>Enter 3 digits (000-999)</small>
    <input type="number" maxlength="3" placeholder="Enter Panna (3 digits)" />
  </div>

  <!-- AMOUNT -->
  <div class="card">
    <label>Amount</label>
    <small>Enter bid amount</small>
    <input type="number" placeholder="Enter Amount" />
  </div>

</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button>
    <i class="fa-regular fa-user"></i>
    <span>Refer</span>
  </button>

  <button>
    <i class="fa-regular fa-clock"></i>
    <span>History</span>
  </button>

  <button class="home">
    <i class="fa-solid fa-house"></i>
  </button>

  <button>
    <i class="fa-solid fa-money-bill"></i>
    <span>Bid</span>
  </button>

  <button>
    <i class="fa-solid fa-wallet"></i>
    <span>Wallet</span>
  </button>
</nav>

<script src="js/sangam0.js"></script>
<script src="nav.js"></script>
</body>
</html>
