<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gali Admin Bets</title>
<link rel="stylesheet" href="global.css">
<style>
body{
  background:#0a1a2f;
  color:#00eaff;
  font-family:Segoe UI,Arial;
  padding:16px
}

h2{margin-bottom:10px}

.summary{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-bottom:20px
}

.box{
  background:#001a3d;
  border:1px solid #00eaff44;
  border-radius:14px;
  padding:14px;
  text-align:center
}

.box b{font-size:20px;color:#0ff}
.box small{display:block;color:#7fefff;margin-top:4px}

.card{
  background:#001a3d;
  border:1px solid #00eaff44;
  border-radius:14px;
  padding:12px;
  margin-bottom:10px
}

small{color:#7fefff}
</style>
</head>

<body>

<h2>📊 Gali Disawar – Admin Summary</h2>

<div class="summary">
  <div class="box"><b id="players">0</b><small>Players</small></div>
  <div class="box"><b id="bet">₹0</b><small>Total Bet</small></div>
  <div class="box"><b id="win">₹0</b><small>Total Win</small></div>
  <div class="box"><b id="loss">₹0</b><small>Total Loss</small></div>
</div>

<h3>🧾 All User Bets</h3>
<div id="list">Loading...</div>

<script>
const token = localStorage.getItem("token");
const matchId = localStorage.getItem("galiAdminMatchId");
const API = "https://tirupati-matka.onrender.com/api/gali";

/* LOAD SUMMARY */
async function loadSummary() {
  try {
    const res = await fetch(`${API}/admin/bets-summary/${matchId}`, {
      headers: { Authorization: "Bearer " + token }
    });
    const data = await res.json();

    if (!data.success) return;

    document.getElementById("players").innerText = data.totalPlayers || 0;
    document.getElementById("bet").innerText = "₹" + (data.totalBet || 0);
    document.getElementById("win").innerText = "₹" + (data.totalWin || 0);
    document.getElementById("loss").innerText = "₹" + (data.totalLoss || 0);
  } catch (err) {
    console.error("Load summary error:", err);
  }
}

/* LOAD ALL BETS */
async function loadBets() {
  try {
    const res = await fetch(`${API}/admin/bets/${matchId}`, {
      headers: { Authorization: "Bearer " + token }
    });
    const data = await res.json();

    const list = document.getElementById("list");
    list.innerHTML = "";

    if (!data.success || !data.bets.length) {
      list.innerHTML = "<p>No bets found</p>";
      return;
    }

    data.bets.forEach(b => {
      list.innerHTML += `
        <div class="card">
          <b>${b.user?.name || "User"}</b> (${b.user?.phone || ""})<br>
          <small>Type:</small> ${b.betType} • <small>For:</small> ${b.betFor}<br>
          <small>Number:</small> <b>${b.number}</b><br>
          <small>Amount:</small> ₹${b.amount}<br>
          <small>Status:</small> ${b.resultStatus || "pending"}
        </div>
      `;
    });
  } catch (err) {
    console.error("Load bets error:", err);
  }
}

/* AUTO REFRESH EVERY 10 SECONDS */
setInterval(() => {
  loadSummary();
  loadBets();
}, 10000);

/* INITIAL LOAD */
loadSummary();
loadBets();
</script>
<script src="nav.js"></script>
</body>

</html>
