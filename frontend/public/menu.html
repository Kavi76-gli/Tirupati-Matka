<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Menu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="global.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">
    <span>Kalyan Satka <b>Matka</b></span>
  </div>
  <div class="header-right">
    <span>🔔</span>
    <span class="top-balance">₹0.00</span>
    <span class="close-btn" onclick="closeMenu()">✕</span>
  </div>
</header>

<!-- MENU CONTENT -->
<div class="menu-container">
  <h2 class="menu-title">MENU</h2>

  <div class="menu-item" onclick="go('add-fund.html')">
    <span>₹</span>
    <p>Add Cash</p>
    <span>›</span>
  </div>

  <div class="menu-item" onclick="go('withdraw.html')">
    <span>💳</span>
    <p>Withdraw</p>
    <span>›</span>
  </div>

  <div class="menu-item" onclick="go('game-ratio.html')">
    <span>%</span>
    <p>Game Ratio</p>
    <span>›</span>
  </div>

  <div class="menu-item" onclick="go('bank-details.html')">
    <span>🏦</span>
    <p>Bank Details</p>
    <span>›</span>
  </div>

  <div class="menu-item" onclick="go('refer.html')">
    <span>👥</span>
    <p>Refer & Earn</p>
    <span>›</span>
  </div>

  <div class="menu-item logout" onclick="logout()">
    <span>⎋</span>
    <p>Log Out</p>
    <span>›</span>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <div onclick="goPage('reer.html')">👤<br>Refer</div>
  <div onclick="goPage('history.html')">⏱<br>History</div>
  <div class="home" onclick="goPage('home.html')">🏠</div>
  <div onclick="goPage('bid.html')">💵<br>Bid</div>
  
  <div onclick="goPage('wallet.html')">👛<br>Wallet</div>
</nav>
<script>
  function goPage(page) {
    window.location.href = page;
  }
</script>

<script src="js/menu.js"></script>
<script src="nav.js"></script>
</body>
</html>
