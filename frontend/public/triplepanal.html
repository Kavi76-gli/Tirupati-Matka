<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triple Panna</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="global.css">
<style>
/* ==============================
   RESET & BASE
============================== */
* { margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI", system-ui, sans-serif; }
body { min-height:100vh; background:radial-gradient(circle at top,#0a1f44,#020814); color:#e6f1ff; display:flex; flex-direction:column; }
main { flex:1; overflow-y:auto; padding-bottom:160px; } /* leave space for submit + nav */

/* HEADER */
/* HEADER */
.header {
  height: 76px;
  background: linear-gradient(180deg, #000000, #050505);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  border-bottom: 1px solid rgba(212,175,55,0.45);
}

/* LOGO AREA */
.logo {
  display: flex;
  align-items: center;
}

/* LOGO IMAGE – CLEAR & PREMIUM */
.logo img {
  height: 64px;          /* 🔥 bigger = clarity */
  width: auto;
  object-fit: contain;
  filter: 
    contrast(1.25)
    brightness(1.15);
}


/* RIGHT ICONS */
.header-icons {
  display: flex;
  align-items: center;
  gap: 14px;
}

/* ICON STYLE */
.header-icons i {
  font-size: 20px;
  color: #d4af37;             /* gold tone */
  cursor: pointer;
}

/* BALANCE */
.balance {
  background: linear-gradient(135deg, #b8962e, #f3da8c);
  color: #2b1a00;
  padding: 6px 14px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 700;
}
/* MARKET INFO */
.market { display:flex; align-items:center; gap:12px; margin:16px; padding:16px; border-radius:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(0,234,255,0.5); box-shadow:0 0 22px rgba(0,234,255,0.25); }
.market-left .icon { width:48px; height:48px; display:flex; justify-content:center; align-items:center; font-weight:bold; font-size:22px; border-radius:12px; background:linear-gradient(135deg,#0b4cff,#00eaff); color:#001428; box-shadow:0 0 15px rgba(0,234,255,0.9); }
.market-left h3 { font-size:18px; text-shadow:0 0 10px #00eaff; }
.market-left p { font-size:14px; opacity:0.85; }

/* SEARCH */
.search-box { display:flex; gap:10px; padding:0 16px 14px; }
.search-box input { flex:1; padding:12px 16px; border-radius:30px; border:1px solid #00eaff; background:rgba(0,0,0,0.4); color:#e6f1ff; outline:none; box-shadow:inset 0 0 12px rgba(0,234,255,0.4); }
.search-box button { padding:12px 22px; border-radius:30px; border:none; font-weight:bold; cursor:pointer; color:#001428; background:linear-gradient(135deg,#00eaff,#0b4cff); box-shadow:0 0 18px rgba(0,234,255,0.9); transition:0.25s; }
.search-box button:hover { transform:scale(1.08); box-shadow:0 0 30px rgba(0,234,255,1); }

/* DIGIT FILTER */
.digits { display:flex; gap:10px; padding:0 16px 12px; overflow-x:auto; }
.digits button { min-width:42px; padding:10px; border-radius:12px; background:rgba(0,0,0,0.45); color:#00eaff; border:1px solid #00eaff; font-weight:bold; cursor:pointer; box-shadow:0 0 10px rgba(0,234,255,0.5); transition:0.25s; }
.digits button.active, .digits button:hover { background:linear-gradient(135deg,#0b4cff,#00eaff); color:#001428; transform:scale(1.1); box-shadow:0 0 22px rgba(0,234,255,1); }

/* PANNA GRID */
#pannaGrid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; padding:16px; }
.card { background:rgba(255,255,255,0.05); border-radius:18px; padding:16px; text-align:center; border:1px solid rgba(0,234,255,0.5); box-shadow:0 0 22px rgba(0,234,255,0.25); }
.card h2 { font-size:28px; margin-bottom:10px; text-shadow:0 0 10px #00eaff; }
.card input { width:100%; padding:12px; border-radius:12px; border:1px solid #00eaff; background:rgba(0,0,0,0.4); color:#e6f1ff; text-align:center; outline:none; box-shadow:inset 0 0 10px rgba(0,234,255,0.4); }
.card .hint { margin-top:8px; font-size:13px; opacity:0.8; }

/* SUBMIT BUTTON */
.submit { position:fixed; bottom:60px; left:50%; transform:translateX(-50%); width:90%; z-index:1000; }
.submit button { width:100%; padding:16px; font-size:18px; font-weight:800; border:none; border-radius:18px; cursor:pointer; color:#001428; background:linear-gradient(135deg,#00eaff,#0b4cff); box-shadow:0 0 28px #00eaff; transition:0.3s; }
.submit button:hover { transform:scale(1.05); box-shadow:0 0 40px #00eaff; }

/* SIDE MENU */
.side-menu { position:fixed; top:0; right:-280px; width:260px; height:100%; background:#020f24; box-shadow:-5px 0 15px #00eaff44; transition:0.3s; z-index:999; }
.side-menu.active { right:0; }
.menu-header { display:flex; justify-content:space-between; align-items:center; padding:15px; color:#00eaff; border-bottom:1px solid #00eaff55; }
.close-btn { background:none; border:none; font-size:24px; color:#00eaff; cursor:pointer; }
.menu-list { list-style:none; padding:10px; }
.menu-list li { padding:12px; margin-bottom:8px; background:#001a3d; border-radius:10px; cursor:pointer; border:1px solid #00eaff33; transition:0.3s; }
.menu-list li:hover { background:#003366; box-shadow:0 0 10px #00eaff55; }

/* BOTTOM NAV */
.bottom-nav { position:fixed; bottom:0; width:100%; display:flex; justify-content:space-around; padding:8px 0; background:#020f24; border-top:1px solid #00eaff55; box-shadow:0 -5px 15px #00eaff22; z-index:1000; }
.nav-item { text-align:center; color:#00eaffaa; font-size:12px; cursor:pointer; }
.nav-item i { font-size:18px; display:block; }
.nav-item.center { background:#00eaff; color:#001a3d; padding:10px 16px; border-radius:50%; margin-top:-20px; box-shadow:0 0 20px #00eaff; }
.nav-item.center i { color:#001a3d; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">
    <img src="ka.jpeg" alt="Kalyan Master Logo">
  </div>

  <div class="header-icons">
    <i class="fa-solid fa-bell" onclick="goPage('notification.html')"></i>

    <div class="balance" id="balance">₹0.00</div>

    <i class="fa-solid fa-bars" onclick="toggleMenu()"></i>
  </div>
</div>

<main>
  <!-- MARKET INFO -->
  <div class="market">
    <div class="market-left">
      <div class="icon">K</div>
      <div>
        <h3 id="gameName">Game</h3>
        <p id="betInfoText">Triple Panna • Open</p>
      </div>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search panna">
    <button onclick="searchPanna()">Go</button>
  </div>

  <!-- DIGIT FILTER -->
  <div class="digits">
    <button onclick="filterDigit('0')">0</button>
    <button onclick="filterDigit('1')">1</button>
    <button onclick="filterDigit('2')">2</button>
    <button onclick="filterDigit('3')">3</button>
    <button onclick="filterDigit('4')">4</button>
    <button onclick="filterDigit('5')">5</button>
    <button onclick="filterDigit('6')">6</button>
    <button onclick="filterDigit('7')">7</button>
    <button onclick="filterDigit('8')">8</button>
    <button onclick="filterDigit('9')">9</button>
  </div>

  <!-- PANNA GRID -->
  <div id="pannaGrid"></div>
</main>

<!-- SUBMIT BUTTON -->
<div class="submit">
  <button onclick="submitBids()">Submit Bid</button>
</div>

<!-- SIDE MENU -->
<div class="side-menu" id="sideMenu">
  <div class="menu-header">
    <h3>Menu</h3>
    <button class="close-btn" onclick="toggleMenu()">×</button>
  </div>
  <ul class="menu-list">
     <li onclick="go('profile.html')">Profile</li>
    <li onclick="go('add-fund.html')">Deposit</li>
    <li onclick="go('withdraw.html')">Withdraw</li>
    <li onclick="go('transition.html')">Transactions</li>
    <li onclick="go('gamezone.html')">Game Zone</li>
     <li onclick="go('reer.html')">Refer & Earn</li>
    <li onclick="go('history.html')">History</li>
    <li onclick="go('ratio.html')">Ratios</li>
    <li onclick="go('logout.html')">Logout</li>
  </ul>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item" onclick="goPage('reer.html')"><i class="fa-solid fa-user"></i><span>Refer</span></div>
  <div class="nav-item" onclick="goPage('history.html')"><i class="fa-solid fa-clock"></i><span>History</span></div>
  <div class="nav-item center" onclick="goPage('gamezone.html')"><i class="fa-solid fa-house"></i><span>Home</span></div>
  <div class="nav-item" onclick="goPage('bid.html')"><i class="fa-solid fa-gavel"></i><span>Bid</span></div>
  <div class="nav-item" onclick="goPage('wallet.html')"><i class="fa-solid fa-wallet"></i><span>Wallet</span></div>
</div>

<script>
/* ==============================
   LOAD BET INFO
============================== */
const bet = JSON.parse(localStorage.getItem("betInfo"));
if (!bet) {
  alert("No game selected");
  location.href = "gamezone.html";
}

const gameId = bet.gameId || bet.matchId;

/* SHOW GAME DETAILS */
document.getElementById("gameName").innerText = bet.gameName;
document.getElementById("betInfoText").innerText =
  `${bet.betType} • ${bet.betFor.toUpperCase()}`;

/* ==============================
   TRIPLE PANNA DATA
============================== */
const pannaMap = {
  "0": ["000"],
  "1": ["111"],
  "2": ["222"],
  "3": ["333"],
  "4": ["444"],
  "5": ["555"],
  "6": ["666"],
  "7": ["777"],
  "8": ["888"],
  "9": ["999"]
};

let currentList = [];
const grid = document.getElementById("pannaGrid");

/* ==============================
   RENDER PANNA
============================== */
function render(list) {
  grid.innerHTML = "";
  list.forEach(p => {
    grid.innerHTML += `
      <div class="card">
        <h2>${p}</h2>
        <input id="bid_${p}" type="number" placeholder="₹ Amount">
      </div>
    `;
  });
}

/* ==============================
   FILTER BY DIGIT
============================== */
function filterDigit(d) {
  document.querySelectorAll(".digits button")
    .forEach(b => b.classList.remove("active"));

  event.target.classList.add("active");
  currentList = pannaMap[d] || [];
  render(currentList);
}

/* ==============================
   SEARCH PANNA
============================== */
function searchPanna() {
  const v = document.getElementById("searchInput").value.trim();
  render(currentList.filter(p => p.includes(v)));
}

/* ==============================
   SUBMIT BIDS
============================== */
function submitBids() {
  let bids = [];
  let total = 0;

  currentList.forEach(p => {
    const input = document.getElementById("bid_" + p);
    if (input && Number(input.value) > 0) {
      bids.push({
        number: p,
        amount: Number(input.value)
      });
      total += Number(input.value);
    }
  });

  if (!bids.length) {
    alert("Enter bid amount");
    return;
  }

  localStorage.setItem("pendingBet", JSON.stringify({
    matchId: gameId,
    gameName: bet.gameName,
    betType: bet.betType,     // triple-panna
    betFor: bet.betFor,
    bids,
    totalAmount: total
  }));

  location.href = "bid-details.html";
}

/* ==============================
   MENU + NAV
============================== */
function toggleMenu() {
  document.getElementById("sideMenu").classList.toggle("active");
}

function goPage(page) {
  window.location.href = page;
}

/* ==============================
   LOAD BALANCE
============================== */
const API = "https://tirupati-matka.onrender.com/api/auth";
const token = localStorage.getItem("token");

async function loadBalance() {
  const r = await fetch(API + "/balance", {
    headers: { Authorization: "Bearer " + token }
  });
  const d = await r.json();
  if (d.success) balance.innerText = "₹ " + d.balance;
}

function go(page) {
  window.location.href = page;
}

loadBalance();
</script>
<script src="nav.js"></script>

</body>
</html>
