<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wallet Transactions</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="global.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",sans-serif}
body{
  background:radial-gradient(circle at top,#0a1a2f,#020b18);
  color:#e6f1ff;
  padding-bottom:90px;
}

/* ================= HEADER ================= */
/* HEADER */
.header {
  height: 76px;
  background: linear-gradient(180deg, #000000, #050505);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  border-bottom: 1px solid rgba(212,175,55,0.45);
}

/* LOGO AREA */
.logo {
  display: flex;
  align-items: center;
}

/* LOGO IMAGE – CLEAR & PREMIUM */
.logo img {
  height: 64px;          /* 🔥 bigger = clarity */
  width: auto;
  object-fit: contain;
  filter: 
    contrast(1.25)
    brightness(1.15);
}


/* RIGHT ICONS */
.header-icons {
  display: flex;
  align-items: center;
  gap: 14px;
}

/* ICON STYLE */
.header-icons i {
  font-size: 20px;
  color: #d4af37;             /* gold tone */
  cursor: pointer;
}

/* BALANCE */
.balance {
  background: linear-gradient(135deg, #b8962e, #f3da8c);
  color: #2b1a00;
  padding: 6px 14px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 700;
}

/* ================= CARD ================= */
.card{
  background:#061a33;
  margin:15px;
  padding:15px;
  border-radius:16px;
}
.card h3{
  color:#00e5ff;
  margin-bottom:12px;
}

/* ================= TABLE ================= */
table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
th,td{
  padding:10px;
  text-align:center;
  border-bottom:1px solid #ffffff15;
}
th{color:#00e5ff}

/* ================= BADGES ================= */
.badge{
  padding:4px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
}
.credit{background:#00e676;color:#000}
.debit{background:#ff5252;color:#000}

/* EMPTY */
.empty{
  text-align:center;
  padding:20px;
  color:#90caf9;
}

/* ================= BOTTOM NAV ================= */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 70px;
  background: linear-gradient(180deg, #0d47ff, #0a3dd1);
  display: flex;
  justify-content: space-around;
  align-items: center;
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;
  box-shadow: 0 -6px 16px rgba(0,0,0,0.25);
  z-index: 999;
  font-family: "Segoe UI", sans-serif;
  position: fixed;
}

/* NAV ITEM */
.bottom-nav .nav-item {
  flex: 1;
  text-align: center;
  color: rgba(255,255,255,0.75);
  font-size: 11px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: 0.25s ease;
  position: relative;
}

.bottom-nav .nav-item i {
  font-size: 20px;
  margin-bottom: 4px;
}

.bottom-nav .nav-item span {
  font-weight: 500;
}

/* ACTIVE ITEM */
.bottom-nav .nav-item.active {
  color: #ffffff;
  font-weight: 600;
}

/* CENTER (HOME) BUTTON */
.bottom-nav .nav-item.center {
  transform: translateY(-18px);
}

.bottom-nav .nav-item.center i {
  background: #ffffff;
  color: #0d47ff;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: 0 6px 14px rgba(0,0,0,0.25);
  margin-bottom: 6px;
}

.bottom-nav .nav-item.center span {
  color: #ffffff;
  font-weight: 600;
}

/* ACTIVE INDICATOR BAR */
.active-indicator {
  position: absolute;
  bottom: 6px;
  height: 3px;
  width: 40px;
  background: #ffffff;
  border-radius: 2px;
  transition: transform 0.3s ease;
}


/* ================= SIDE MENU ================= */
.side-menu{
  position:fixed;
  top:0;
  right:-280px;          /* hidden */
  width:260px;
  height:100vh;
  background:#061a33;
  color:#fff;
  z-index:9999;
  transition:0.3s ease;
  box-shadow:-5px 0 15px rgba(0,0,0,.4);
}

.side-menu.active{
  right:0;               /* visible */
}

.menu-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  background:#0d47ff;
}

.menu-header h3{
  font-size:16px;
}

.close-btn{
  background:none;
  border:none;
  font-size:24px;
  color:#fff;
  cursor:pointer;
}

.menu-list{
  list-style:none;
  padding:10px;
}

.menu-list li{
  padding:14px;
  border-bottom:1px solid #ffffff20;
  cursor:pointer;
}

.menu-list li:hover{
  background:#0a3dd1;
}




/* ================= MOBILE RESPONSIVE TABLE ================= */
@media (max-width: 768px) {

  table {
    font-size: 12px;
  }

  thead {
    display: none;
  }

  tbody tr {
    display: block;
    background: rgba(255,255,255,0.04);
    margin-bottom: 12px;
    padding: 12px;
    border-radius: 14px;
    box-shadow: 0 0 10px rgba(0,191,255,0.15);
  }

  tbody td {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border: none;
    text-align: left;
  }

  tbody td::before {
    content: attr(data-label);
    font-weight: 700;
    color: #7df9ff;
    font-size: 12px;
  }

  .badge {
    font-size: 11px;
  }

  .credit {
    background: rgba(0, 230, 118, 0.25);
    color: #22c55e;
  }

  .debit {
    background: rgba(255, 82, 82, 0.25);
    color: #ef4444;
  }
}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->
<div class="header">
  <div class="logo">
    <img src="ka.jpeg" alt="Kalyan Master Logo">
  </div>

  <div class="header-icons">
    <i class="fa-solid fa-bell" onclick="goPage('notification.html')"></i>

    <div class="balance" id="balance">₹0.00</div>

    <i class="fa-solid fa-bars" onclick="toggleMenu()"></i>
  </div>
</div>

<!-- ================= TRANSACTIONS ================= -->
<div class="card">
  <h3>Wallet Transactions</h3>

  <table>
    <thead>
      <tr>
        <th>Type</th>
      <th>Amount</th>
      <th>Method</th>
      <th>Status</th>
      <th>Date</th>
      </tr>
    </thead>
    <tbody id="txnBody"></tbody>
  </table>

  <div id="empty" class="empty" style="display:none;">
    No transactions found
  </div>
</div>

<!-- SIDE MENU -->
<div class="side-menu" id="sideMenu">
  <div class="menu-header">
    <h3>Menu</h3>
    <button class="close-btn" onclick="toggleMenu()">×</button>
  </div>
  <ul class="menu-list">
      <li onclick="go('profile.html')">Profile</li>
    <li onclick="go('add-fund.html')">Deposit</li>
    <li onclick="go('withdraw.html')">Withdraw</li>
    <li onclick="go('transition.html')">Transactions</li>
    <li onclick="go('gamezone.html')">Game Zone</li>
     <li onclick="go('reer.html')">Refer & Earn</li>
    <li onclick="go('history.html')">History</li>
    <li onclick="go('ratio.html')">Ratios</li>
    <li onclick="go('logout.html')">Logout</li>
  </ul>
</div>

<!-- ================= BOTTOM NAV ================= -->
<div class="bottom-nav">
  <div class="nav-item" data-page="reer.html"><i class="fa-solid fa-user"></i><span>Refer</span></div>
  <div class="nav-item" data-page="history.html"><i class="fa-solid fa-clock"></i><span>History</span></div>
  <div class="nav-item center" data-page="gamezone.html"><i class="fa-solid fa-house"></i></div>
  <div class="nav-item active" data-page="transition.html"><i class="fa-solid fa-gavel"></i><span>Transaction</span></div>
  <div class="nav-item" data-page="wallet.html"><i class="fa-solid fa-wallet"></i><span>Wallet</span></div>
</div>

<script>
const API = "https://tirupati-matka.onrender.com//api";
const token = localStorage.getItem("token");
const balanceEl = document.getElementById("balance");

/* ================= BALANCE ================= */
async function loadBalance(){
  try{
    const r = await fetch(API + "/auth/balance", {
      headers: { Authorization: "Bearer " + token }
    });
    const d = await r.json();
    if(d.success){
      balanceEl.innerText = "₹ " + d.balance.toFixed(2);
    }
  }catch(err){
    console.error("Balance error", err);
  }
}

/* ================= TRANSACTIONS ================= */

async function fetchTransactions() {
  try {
    const res = await fetch(API + "/auth/transactions", {
      headers: { Authorization: "Bearer " + token }
    });

    const data = await res.json();
    const tbody = document.getElementById("txnBody");
    const empty = document.getElementById("empty");

    tbody.innerHTML = "";

    if (!data.transactions || data.transactions.length === 0) {
      empty.style.display = "block";
      return;
    }

    empty.style.display = "none";

    data.transactions.forEach(txn => {
      const tr = document.createElement("tr");

      const isCredit =
        txn.type === "deposit" ||
        txn.type === "admin_update" ||
        txn.type === "win";

      const date = txn.createdAt
        ? new Date(txn.createdAt).toLocaleString()
        : "-";

      tr.innerHTML = `
        <td>
          <span class="badge ${isCredit ? "credit" : "debit"}">
            ${txn.type.toUpperCase()}
          </span>
        </td>

        <td>₹ ${Number(txn.amount).toFixed(2)}</td>

        <td>${txn.method ? txn.method.toUpperCase() : "-"}</td>

        <td>
          <span class="status ${txn.status}">
            ${txn.status ? txn.status.toUpperCase() : "-"}
          </span>
        </td>

        <td>${date}</td>
      `;

      tbody.appendChild(tr);
    });

  } catch (err) {
    console.error("fetchTransactions error:", err);
  }
}


/* ================= NAVIGATION ================= */
document.querySelectorAll(".nav-item").forEach(item=>{
  item.onclick = ()=>location.href = item.dataset.page;
});

function toggleMenu(){ document.getElementById("sideMenu").classList.toggle("active"); }

/* ================= INIT ================= */
document.addEventListener("DOMContentLoaded", ()=>{
  loadBalance();
  fetchTransactions();
});
function go(page) {
  window.location.href = page;
}

</script>
<script src="nav.js"></script>
</body>
</html>
